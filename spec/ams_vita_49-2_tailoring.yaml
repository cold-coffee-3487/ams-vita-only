      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .dataAddressStructure
      Function: An array of records listing all the data streams associated with the Control Packet this AckR packet is responding
        to, by data stream SID and MFA address. When present it may replace the information in (2/30) .citedSID and always
        replaces the information in (4/24) dataAddressIndex. The corresponding MFP addresses are contained in the same field
        location (4/25) of the Control Packet this packet is responding to. This array provides greater flexibility than using
        .citedSId and .dataAddressIndex at the cost of variable-length Control and AckR packets. The array header consists
        of the 3 mandatory header words (see reference or Change Notes) plus a variable number of records consisting of 2
        or 1 words (SID, MFP Address Index) or (MFP Address Index), as indicated in header word 3.
      Field Size (words): '-1'
      Notes: Data Address Index and Data Address Structure both indicate the MFP data addresses to which received data should
        be provided. These two fields are mutually exclusive, consequently at most one field may have a non-zero CIF bit
    - Bit: '22'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .dataAddressTime
      Function: If the data address(es) of 4/24 or 4/23 are not immediately applicable (e.g., If the MFA must switch antenna
        faces during a stream of VITA data packets transporting one long Rx/Tx packet, the MFA scheduler may send a new AckR
        packet with the new MFA port addresses with some lead time before the change), The .dataAddressTime parameter indicates
        when the data address information in 4/24 or 4/23 becomes applicable. Offset from time stamp.
      Field Size (words): '2'
    - Bit: '21'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .txDigitalInputPower
      Function: Bits 15:0 contain Nominal power level of digital TX signal input to MFA for transmission, dBfs, where "full
        scale power" shall be defined as the power of a complex digital sinusoid with amplitude equal to full scale. Set to
        0 for Rx. Set bits 31:16 to 0.
      Field Size (words): '1'
    - Bit: '20:0'
      Designation: .reservedBits20to0
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Function: Reserved for future extensions
  - group_name: .cif7
    requirement: Forbidden
    fields:
    - Word: N/A
      Bit: '31:0'
      Designation: .cif7
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Function: Control Indicator Field 7 is not used in the base set
  - group_name: .payloadFields
    requirement: Mandatory
    notes: Payload fields are defined by enabled CIF indicators and the Control-Context Payload Formats table. Payload fields
      are included in CIF-bit order and may contain additional fields from Extension Set. This group is a metadata placeholder
      and has no fixed rows.
    fields: []
- title: ExecutionAck(AckX)Packet
  text: Extension AckX Packet Template (Execution Acknowledgement packet)
  groups:
  - group_name: .header
    requirement: Mandatory
    notes: These fields must mirror the corresponding control packet
    fields:
    - Word: '1'
      Bit: '31:28'
      Bit Used: B
      Default Value: '0111'
      Range: '0111'
      Designation: .type
      Function: 'Packet Type: 0111 => Extension Command Packet'
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '27'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cBit
      Function: Indicates whether CLASS ID is included in the prologue
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '26'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .isAck
      Function: Indicates THAT THIS IS an acknowledge packet
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '25'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit25
      Function: Reserved
      Time Determined: N/A
      Time When Payload Value Determined: N/A
    - Bit: '24'
      Bit Used: B
      Default Value: '0'
      Range: '0'
      Designation: .isCancellation
      Function: Indicates whether this is cancellation packet
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '23:22'
      Bit Used: B
      Default Value: '11'
      Range: '11'
      Designation: .tsi
      Function: 'Indicates: 00 No int seconds time stamp, 01 => UTC, 10 => GPS, 11 => Other'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '21:20'
      Bit Used: B
      Default Value: '10'
      Range: '10'
      Designation: .tsf
      Function: 'Indicates: 00 => No frac seconds field, 01 => sample count, 10 => picoseconds, 11 => free running count'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '19:16'
      Bit Used: B
      Default Value: '0'
      Range: 0:15
      Designation: .packetCount
      Function: 4-Bit Packet sequence number for this packet type in this streamID
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '15:0'
      Bit Used: B
      Default Value: N/A
      Range: 0:2^16-1
      Designation: .packetSize
      Function: Total number of 32-bit words in the packet including the prologue; computed from the final packet word count.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
  - group_name: .streamId (Stream Identifier)
    requirement: Mandatory
    fields:
    - Word: '2'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Designation: .sid
      Function: See Control and Context SID definitions.  Data SIDs will match the applicable control SIDs
      Time Determined: VA Initialization
      Time When Payload Value Determined: N/A
      Notes: See Control Tab
  - group_name: .classId (Class Identifier)
    requirement: Mandatory
    notes: Packet Class Identifier bits should match Extension Control Packet Class ID bits
    fields:
    - Word: '3'
      Bit: '31:27'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .padBitCount
      Function: "Number of pad bits (0\u202631) at the end of the packet to hit a 32-bit word boundary. Not used by Base Set."
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '26:24'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits26to24
      Function: Reserved
      Time Determined: N/A
      Time When Payload Value Determined: N/A
    - Bit: '23:0'
      Bit Used: B
      Default Value: '0xAAAAAA'
      Range: '0xAAAAAA'
      Designation: .oui
      Function: Organization Number. Organizationally Unique Identifier (OUI),  "A 24-bit number that uniquely identifies
        a vendor, manufacturer, or other organization globally or worldwide"
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Word: '4'
      Bit: '31:24'
      Bit Used: B
      Default Value: '0x04'
      Range: '4:5'
      Designation: .infoClassCode_Type
      Function: 0 => Unknown; 1 => TxComm, 2 => RxComm, 3 => Sensor;  4 => TxComm base set; 5 => RxComm Base Set; 6 => TxComm
        extended set 1; 7 => RxComm extended set 1; 8 => TxComm  extended set 2; 9 => RxComm extended set 2; (10-255) => TBD
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '23:16'
      Bit Used: B
      Default Value: '0x00'
      Range: 0:2^8-1
      Designation: .infoClassCode_Version
      Function: Version number of information class
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '15:8'
      Bit Used: B
      Default Value: '0x0C'
      Range: '0x0C'
      Designation: .packetClassCode_Type
      Function: 'Defined PacketTypes:  0x00 => undefined, 0x0A => Base Set Control ScheduleRequest, 0x0B => Base Set Schedule
        Acknowledge (AckR),  0x0C => Base Set Execution Acknowledge (AckX), 0x0D => Base Set Data, 0x0E => Base Set DataContext'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '7:0'
      Bit Used: B
      Default Value: '0x05'
      Range: 0:2^8-1
      Designation: .packetClassCode_Version
      Function: Version of Packet Class definition for specified type
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
  - group_name: .timeStamp (Time Stamp)
    requirement: Mandatory
    fields:
    - Word: '5'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^32-1
      Designation: .tsi
      Function: Integer time stamp, UTC seconds since midnight, Jan. 1, 2019
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
    - Word: '6'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^64-1
      Designation: .tsf
      Function: Fractional time stamp most-significant (Upper 32 bits); format indicated by Header.tsf, picoseconds since
        last seconds update
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
    - Word: '7'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Function: Fractional time stamp least-significant (Lower 32 bits); format indicated by Header.tsf, picoseconds since
        last seconds update
      Designation: .tsfLower
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
  - group_name: .cam (Control/Ack Mode Field)
    requirement: Mandatory
    fields:
    - Word: '8'
      Bit: '31'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ce
      Function: Identifier fields are not used in the AMS Base Set; set to zero
    - Bit: '30'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ie
      Function: Identifier fields are not used in the AMS Base Set; set to zero
    - Bit: '29'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .cr
      Function: Identifier fields are not used in the AMS Base Set; set to zero
    - Bit: '28'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ir
      Function: Identifier fields are not used in the AMS Base Set; set to zero
    - Bit: '27'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .p
      Function: Matches value in Control Packet being Acknowledged
    - Bit: '26'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .w
      Function: Matches value in Control Packet being Acknowledged
    - Bit: '25'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .er
      Function: Matches value in Control Packet being Acknowledged
    - Bit: '24:23'
      Bit Used: B
      Default Value: '10'
      Range: '10'
      Designation: .actionBits
      Function: Matches value in Control Packet being Acknowledged
    - Bit: '22'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .nack
      Function: Matches value in Control Packet being Acknowledged
    - Bit: '21'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit21
      Function: Matches value in Control Packet being Acknowledged
    - Bit: '20'
      Bit Used: B
      Default Value: '0'
      Range: '0'
      Designation: .ackV
      Function: 1 = > Indicates this is a Validation Ack packet, 0 => otherwise. AckV, AckX, and AckS are mutually exclusive.
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '19'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .ackX
      Function: 1 = > Indicates this is an Execution Ack packet, 0 => otherwise. AckV, AckX, and AckS are mutually exclusive.
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '18'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ackS
      Function: 1 => Indicates this is a Query-State Ack packet, 0 => otherwise. AckV, AckX, and AckS are mutually exclusive.
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '17'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ackW
      Function: Warning reports are not supported in AckX by the AMS Base Set; set to zero
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '16'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .ackEr
      Function: Indicates whether errors were generated
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
      Notes: In AckX packets that support the Baseline Error Reporting format this bit indicates the presence of non-zero
        error indicator bits. When ackEr is 1, EIFs shall be present and shall identify the reported error payload fields.
        When ackEr is 0, no error fields are reported and EIFs shall not be present.
    - Bit: '15'
      Bit Used: B
      Default Value: '0'
      Range: '0'
      Designation: .ackR
      Function: 1 => Indicates this is an Information-Response Ack (AckR) packet, 0 => otherwise
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '14:12'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .timingControl
      Function: '000 => Executed the controls fields with no regard to timestamp constraints

        001 => Executed within the device timing precision window

        010 => Executed within device timing precision  window or within late window

        011 => Executed within device timing precision window or withing early timing  window

        100 => Executed within application timing execution window

        101 => reserved

        110 => reserved

        111 => Did not execute some controls'
      Time Determined: TBD
      Time When Payload Value Determined: N/A
    - Bit: '11'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .ackP
      Function: Indicates validation Partially completed (This Class is not using this bit)
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '10'
      Bit Used: B
      Default Value: '1'
      Range: 0:1
      Designation: .schX
      Function: 0 => one or more fields can NOT be scheduled for execution at time in timestamp, 1 => all fields can be scheduled
        for execution at time in timestamp.  A self-scheduling MFA may send an AckR packet with .schX = 0 if the access requested
        by a Control Packet could not be scheduled. If a request was scheduled and an AckR packet was sent with .schX = 1,
        after which the packet was bumped from the schedule by a higher priority request, a second AckR or an AckV packet
        with .schX = 0 may be sent. An AckX packet with .schX = 0 shall be sent if the control packet was not executed due
        to schedule conflicts, e.g., the allowed (range of) execution time(s) has passed.
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
      Notes: AMS GRA extention allows for AckR or AckV packet response to schedule conflicts
    - Bit: '9:8'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits9to8
      Function: Reserved
    - Bit: '7:4'
      Bit Used: E
      Default Value: '0'
      Range: 0:15
      Designation: .schReqType
      Function: Matches values in Control Packet being Acknowledged
    - Bit: '3'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .reqStatusChange
      Function: This doesn't really make sense in an AckV or AckX packet. Set to 0.
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '2:0'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits2to0
      Function: Reserved
  - group_name: .messageId (Unique Message Identifier)
