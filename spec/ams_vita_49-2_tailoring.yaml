title: Common RF MEL VITA 49.2 Control Message Set and Tailoring
intro: 'DISTRIBUTION STATEMENT A: Approved for public release: distribution unlimited.


  This document details the AMS GRA VITA 49.2 tailored packet structures for the Common RF MEL.'
sections:
- title: ControlScheduleRequestPacket
  text: Control Packet Template
  groups:
  - group_name: .header
    requirement: Mandatory
    fields:
    - Word: '1'
      Bit: '31:28'
      Bit Used: B
      Default Value: '0111'
      Range: '0111'
      Designation: .type
      Function: 'Packet Type: 0111 => Extension Command Packet'
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '27'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cBit
      Function: Indicates whether CLASS ID is included in the prologue
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '26'
      Bit Used: B
      Default Value: '0'
      Range: '0'
      Designation: .isAck
      Function: Indicates whether this is an acknowledge packet
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '25'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit25
      Function: Reserved
      Time Determined: N/A
      Time When Payload Value Determined: N/A
    - Bit: '24'
      Bit Used: B
      Default Value: '0'
      Range: '0'
      Designation: .isCancellation
      Function: Indicates whether this is cancellation packet
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '23:22'
      Bit Used: B
      Default Value: '11'
      Range: '11'
      Designation: .tsi
      Function: 'Time Stamp Integer indicates: 00 No int seconds time stamp, 01 => UTC, 10 => GPS, 11 => Other'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '21:20'
      Bit Used: B
      Default Value: '10'
      Range: '10'
      Designation: .tsf
      Function: 'Time Stamp Fractional indicates: 00 => No frac seconds field, 01 => sample count, 10 => picoseconds, 11 =>
        free running count'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '19:16'
      Bit Used: B
      Default Value: '0'
      Range: 0:15
      Designation: .packetCount
      Function: 4-Bit Packet sequence number for this packet type in this streamID
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '15:0'
      Bit Used: B
      Default Value: '32'
      Range: 32:2^16-1
      Designation: .packetSize
      Function: Total number of 32-bit words in this packet including the prologue
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
  - group_name: .streamId (Stream Identifier)
    requirement: Mandatory
    fields:
    - Word: '2'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Designation: .sid
      Function: The Control packet stream ID uniquely identifies selection of the VA configuration instance (with transmit
        and receive direction) and is known by the VAA, VAS and the controlling service.  The stream ID is provided by the
        VAA upon allocation.
      Time Determined: VA Initialization
      Time When Payload Value Determined: N/A
  - group_name: .classId (Class Identifier)
    requirement: Mandatory
    fields:
    - Word: '3'
      Bit: '31:27'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .padBitCount
      Function: "Number of pad bits (0\u202631) at the end of the packet to hit a 32-bit word boundary. Not used by Base Set."
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '26:24'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits26to24
      Function: Reserved
      Time Determined: N/A
      Time When Payload Value Determined: N/A
    - Bit: '23:0'
      Bit Used: B
      Default Value: '0xAAAAAA'
      Range: '0xAAAAAA'
      Designation: .oui
      Function: Organization Number. Organizationally Unique Identifier (OUI),  "A 24-bit number that uniquely identifies
        a vendor, manufacturer, or other organization globally or worldwide".
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Word: '4'
      Bit: '31:24'
      Bit Used: B
      Default Value: '0x04'
      Range: '4:5'
      Designation: .infoClassCode_Type
      Function: 0 => Unknown; 1 => TxComm, 2 => RxComm, 3 => Sensor;  4 => TxComm base set; 5 => RxComm Base Set; 6 => TxComm
        extended set 1; 7 => RxComm extended set 1; 8 => TxComm  extended set 2; 9 => RxComm extended set 2; (10-255) => TBD
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '23:16'
      Bit Used: B
      Default Value: '0x00'
      Range: 0:2^8-1
      Designation: .infoClassCode_Version
      Function: Version number of information class
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '15:8'
      Bit Used: B
      Default Value: '0x0A'
      Range: '0x0A'
      Designation: .packetClassCode_Type
      Function: 'Defined PacketTypes:  0x00 => undefined,  0x0A => Base Set Control ScheduleRequest, 0x0B => Base Set Schedule
        Acknowledge (AckR),  0x0C => Base Set Execution Acknowledge (AckX), 0x0D => Base Set Data, 0x0E => Base Set DataContext'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '7:0'
      Bit Used: B
      Default Value: '0x05'
      Range: 0:2^8-1
      Designation: .packetClassCode_Version
      Function: Version of Packet Class definition for specified type
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
  - group_name: .timeStamp (Time Stamp)
    requirement: Mandatory
    fields:
    - Word: '5'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^32-1
      Designation: .tsi
      Function: Integer time stamp, UTC seconds since midnight, Jan. 1, 2019
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
    - Word: '6'
      Bit: '63:32'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^64-1
      Designation: .tsf
      Function: Fractional time stamp most-significant (Upper 32 bits); format indicated by header.tsf, picoseconds since
        last seconds update
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
    - Word: '7'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Function: Fractional time stamp least-significant (Lower 32 bits); format indicated by header.tsf, picoseconds since
        last seconds update
      Designation: .tsfLower
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
  - group_name: .cam (Control/Ack Mode Field)
    requirement: Mandatory
    fields:
    - Word: '8'
      Bit: '31'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ce
      Function: Controllee identifier fields are not used in the AMS Base Set; set to zero
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '30'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ie
      Function: Controllee identifier format selection is not used in the AMS Base Set; set to zero
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '29'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .cr
      Function: Controller identifier fields are not used in the AMS Base Set; set to zero
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '28'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ir
      Function: Controller identifier format selection is not used in the AMS Base Set; set to zero
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '27'
      Bit Used: B
      Default Value: '0'
      Range: '0'
      Designation: .p
      Function: Partial packet execution permitted. 1 => parameters that did not cause errors or warnings will be exectued,
        and parameters that did cause errors or warnings will be exectued if they were corrected. 0 => any uncorrected errors
        or warnings will cause the entire packet to be rejected. The Baseset does not support warnings, and packets that cause
        errors will not be executed totally or in part.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
      Notes: If [p,w,er] = [0,1,0] then schedule request is cancelled if any errors are generated. Currently warnings are
        not supported. If warnings are generated in a future extension [p,w,er] = [0,1,0] cancels  schedule request if warning
        condition was not corrected. Otherwise schedule request proceeds. See Table 8.3.1.2-1 of [2]
    - Bit: '26'
      Bit Used: E
      Default Value: '0'
      Range: 0:1
      Designation: .w
      Function: Indicates action taken when a warning occurs. 1 =>  the MFA will try to correct parameters that caused warnings,
        0 => it will not. How the MFA behaves when there are uncorrected warnings is determined by p (bit 27). The Base Set
        does not support warnings.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '25'
      Bit Used: B
      Default Value: '0'
      Range: '0'
      Designation: .er
      Function: Indicates action taken when an error occurs. 1 =>  the MFA will try to correct parameters that caused errors,
        0 =>  it will not. How the MFA behaves when there are uncorrected errors is determined by p (bit 27). The Base Set
        does not support attempts to correct errors, and packets that cause errors will not be executed totally or in part.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '24:23'
      Bit Used: B
      Default Value: '10'
      Range: '10'
      Designation: .actionBits
      Function: 'Action Bit Field: 00 => no action, 01 => dry run mode, 10 => execute, 11 => reserved'
      Time Determined: 'Fixed: 10 (execute) - required

        Other values optional'
      Time When Payload Value Determined: N/A
    - Bit: '22'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .nack
      Function: Provide AckV or AckX only on warnings or errors (respond only with negative acklowledements)
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '21'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit21
      Function: Reserved
      Time Determined: N/A
      Time When Payload Value Determined: N/A
    - Bit: '20'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .reqV
      Function: Validation Ack packet requested
      Time Determined: Dynamic (if allowed by VA)
      Time When Payload Value Determined: N/A
    - Bit: '19'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .reqX
      Function: Execution Ack packet requested
      Time Determined: Dynamic (if allowed by VA)
      Time When Payload Value Determined: N/A
    - Bit: '18'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reqS
      Function: Query-State Ack packet requested
      Time Determined: Dynamic (if allowed by VA)
      Time When Payload Value Determined: N/A
    - Bit: '17'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .reqW
      Function: Request warning fields in execution and validation ack packets
      Time Determined: Dynamic (if allowed by VA)
      Time When Payload Value Determined: N/A
      Notes: Base Set does not support Warning Reports
    - Bit: '16'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .reqEr
      Function: Request error fields in execution ack packets
      Time Determined: Dynamic (if allowed by VA)
      Time When Payload Value Determined: N/A
    - Bit: '15'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .reqR
      Function: Information-Response Ack packet requested (see Change Notes)
      Time Determined: Dynamic (if allowed by VA)
      Time When Payload Value Determined: N/A
    - Bit: '14:12'
      Bit Used: E
      Default Value: '0'
      Range: 0:7
      Designation: .timingControl
      Function: 'Timing Control: refer to documentation for details,  000 => indicates "it is at the discretion of the controllee
        when the control fields are executed"'
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '11:8'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ackBits
      Function: Acknowledge bits (zero in control packets)
    - Bit: '7:4'
      Bit Used: B
      Default Value: '1'
      Range: 0:15
      Designation: .schReqType
      Function: 'Schedule request type: 0 => No schedule request. Message is for informational purposes only. The timeStamp
        indicates the time after which the scheduler can expect to reveive schedule requests using the configuration described
        in this packet. 1 =>  Requesting execute starting at timeStamp for dwell seconds; 2 => Requesting execute starting
        between timeStamp + earlyStartTime and timeStamp + lateStartTime for dwell seconds; 3 => Execute when possible starting
        now, until pre-empted by higher priority access, or duration is exceeded, or request is cancelled, return to execution
        at conclusion of pre-empting event (hoover mode); 4-14 => TBD, 15 => Cancel previous request (used in cancellation
        message).'
      Time Determined: Limited per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '3'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reqStatusChange
    - Bit: '2:0'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits2to0
      Function: Reserved
  - group_name: .messageId (Unique Message Identifier)
    requirement: Mandatory
    fields:
    - Word: '9'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Range: 1:2^32-1
      Designation: .messageId
      Function: Used to distinguish Control packets with the same Stream ID and Class ID and to associate Control with Ack
        Packets. This is a continuously increasing message counter (starting at 1) for each unique control packet.
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
  - group_name: .controlleeId (Controllee Identifier, format is either 32-bit or 128-bit and is indicated by .cam.ie)
    requirement: Forbidden
    fields:
    - Word: N/A
      Designation: .controlleeId
      Bit: '31:0'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Function: Unique 32-bit controlee Identifier
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
    - Word: N/A
      Designation: .controlleeUuidMsw
      Bit: 127:96
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Function: Controllee UUID Most Significant Bits
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
    - Word: N/A
      Designation: .controlleeUuidWord2
      Bit: 95:64
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
    - Word: N/A
      Designation: .controlleeUuidWord1
      Bit: '63:32'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
    - Word: N/A
      Designation: .controlleeUuidLsw
      Bit: '31:0'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Function: Controllee UUID Least Significant Bits
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
  - group_name: .controllerId (Controller Identifier, format is either 32-bit or 128-bit and is indicated by .cam.ir)
    requirement: Forbidden
    fields:
    - Word: N/A
      Designation: .controllerId
      Bit: '31:0'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Function: Unique 32-bit controller Identifier
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
    - Word: N/A
      Designation: .controllerUuidMsw
      Bit: 127:96
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Function: Controller UUID Most Significant Bits
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
    - Word: N/A
      Designation: .controllerUuidWord2
      Bit: 95:64
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
    - Word: N/A
      Designation: .controllerUuidWord1
      Bit: '63:32'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
    - Word: N/A
      Designation: .controllerUuidLsw
      Bit: '31:0'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Function: Controller UUID Least Significant Bits
      Time Determined: Per VA Definition
      Time When Payload Value Determined: N/A
  - group_name: .cif0 (Control Indicator Field 0, Legacy Fields)
    requirement: Mandatory
    notes: See Cotrol-Context Payload Formats
    fields:
    - Word: '10'
      Bit: '31'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cfci
      Function: 'Context field change indicator: Control packets are only sent when something needs to be changed so this
        should be set to 1'
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
      Field Size (words): '0'
    - Bit: '30'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .rpi
      Function: Reference point identifier
    - Bit: '29'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .bandwidth
      Function: 3 dB Bandwidth.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: Dynamic if allowed per VA Definition
      Field Size (words): '2'
    - Bit: '28'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .ifRefFreq
      Function: IF reference frequency.  This is the digital frequency  of the IF or baseband signal. ifRefFreq translates
        to/from rfRefFreq + rfRefFreqOffset during frequency conversion.  For real data samples it is in the range 0 - Fs/2,
        for complex data samples it is in the range -Fs/2 - +Fs/2
      Field Size (words): '2'
    - Bit: '27'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .rfRefFreq
      Function: RF reference frequency.  This is usually the center of the analog superchannel and will always be a large
        positive number. If rfRefFreqOffset=0, rfRefFreq translatetes to ifRefFreq during frequency converslin.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: Dynamic within limits of VA definition
      Field Size (words): '2'
    - Bit: '26'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .rfRefFreqOffset
      Function: Offset from RF Ref Freq of RF frequency that translates to/from IF Ref Freq. rfRefFreq+rfRefFreqOffset translatetes
        to/from ifRefFreq during frequency conversion. If rfRefFreqOffset is not provided its value is set to 0.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: Dynamic within limits of VA definition
      Field Size (words): '2'
    - Bit: '25'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .ifBandOffset
      Function: 'IF band offset: IF band center = ifRefFreq + ifBandOffset. ifBandOffset may be positive or negative depending
        on IF band center relative to ifRefFreq.'
      Field Size (words): '2'
    - Bit: '24'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .refLevel
      Function: Reference level relates digital signal amplitude to analog signal power. An analog Reference Point and location
        for the digital Described Signal must be defined in system documentation. The Reference Level is the AC power of a
        single analog sine wave at the reference point that produces a unit-scale digital sine wave as the Described Signal.
        Note that a unit scale sine wave for N-bit two's complement data is defined as one with amplitude ranging from -2^(N-1)
        to +2^(N-1), which exceeds the available range of an N-bit two's complement number at its peak value.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: Fixed or dyanmic, within limits, per VA definition
      Field Size (words): '1'
    - Bit: '23'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .gain
      Function: Gain bits 31:16 are not used in the base set and shall be set to 0. Bits 15:0 should be used in Base Set Rx
        Schedule Requests to control signal amplitude into the MFA ADC. Gain shall not be used on Tx, as it will conflict
        with EIRP (figure of merit, CIF 4/29). Gain bits 15:0 shall be set to 0 in Tx Schdule Requests.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: Dynamic within limits of VA definition
      Field Size (words): '1'
    - Bit: '22'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .overRangeCount
      Function: Over-range count
    - Bit: '21'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .sampleRate
      Function: Sample rate in Hz
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: Fixed or dyanmic, within limits, per VA definition
      Field Size (words): '2'
    - Bit: '20'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .tsa
      Function: Time stamp adjustment
    - Bit: '19'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .tsCalTime
      Function: Time stamp calibration time
    - Bit: '18'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .temp
      Function: Temperature
    - Bit: '17'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .deviceId
      Function: Device identifier
    - Bit: '16'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .sei
      Function: State and Event Indicator. Eight predefined indicator bits with corresponding enable bits, plus 8 user-defined
        bits. Bits 28 and 16 indicate whether AGC is used. See [2] Table 9.10.8-1. Not currently in use.
      Field Size (words): '1'
    - Bit: '15'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .dataFormat
      Function: Signal data packet payload format.  We should always send the data packet format
      Field Size (words): '2'
    - Bit: '14'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .gps
      Function: Formatted GPS
    - Bit: '13'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ins
      Function: Formatted INS
    - Bit: '12'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ecef
      Function: ECEF ephemeris
    - Bit: '11'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .relativeEphemeris
      Function: Relative ephemeris
    - Bit: '10'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ephemerisRefId
      Function: Ephermeris reference ID
    - Bit: '9'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .gpsAscii
      Function: GPS ASCII
    - Bit: '8'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .contextAssocLists
      Function: Context association lists
    - Bit: '7'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .cif7enable
      Function: Field attributes enable
      Time Determined: 'Fixed: 0'
      Time When Payload Value Determined: N/A
    - Bit: '6'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit6
      Function: Reserved
    - Bit: '5'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit5
      Function: Reserved
    - Bit: '4'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cif4enable
      Function: Extension Fields
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '3'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cif3enable
      Function: Temporal, environmental
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '2'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cif2enable
      Function: Identifiers (tags)
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '1'
      Bit Used: B
