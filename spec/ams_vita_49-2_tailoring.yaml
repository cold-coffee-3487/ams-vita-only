- title: ExtensionDataContextPacket
  text: Base Set Extension Data Context Packet Class
  groups:
  - group_name: .header
    requirement: Mandatory
    fields:
    - Word: '1'
      Bit: '31:28'
      Bit Used: B
      Default Value: '0101'
      Range: '0101'
      Designation: .type
      Function: 'Packet Type: 0101 => Extension Context Packet'
    - Bit: '27'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cBit
      Function: Indicates whether CLASS ID is included in the prologue
    - Bit: '26'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit26
      Function: Reserved
    - Bit: '25'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .notV49p0Packet
      Function: Not a V49.0 Packet
    - Bit: '24'
      Bit Used: B
      Default Value: '0'
      Range: '0'
      Designation: .timeStampMode
      Function: Timestamp Mode, 0=> fine, 1=>coarse (see 7.1.1, 7.1.3 and Permission 7.1.4-2)
    - Bit: '23:22'
      Bit Used: B
      Default Value: '11'
      Range: '11'
      Designation: .tsi
      Function: 'Indicates: 00 No int seconds time stamp, 01 => UTC, 10 => GPS, 11 => Other'
    - Bit: '21:20'
      Bit Used: B
      Default Value: '10'
      Range: '10'
      Designation: .tsf
      Function: 'Indicates: 00 => No frac seconds field, 01 => sample count, 10 => picoseconds, 11 => free running count'
    - Bit: '19:16'
      Bit Used: B
      Default Value: '0'
      Range: 0:15
      Designation: .packetCount
      Function: 4-Bit Packet type sequence number
    - Bit: '15:0'
      Bit Used: B
      Default Value: '29'
      Range: '29'
      Designation: .packetSize
      Function: Total number of 32-bit words in the packet including the prologue
  - group_name: .streamId (Stream Identifier)
    requirement: Mandatory
    fields:
    - Word: '2'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Designation: .sid
      Function: Stream ID provided in associated AckR packets used to schedule access. May match associated data stream. Or
        not.
      Notes: See Control Tab
  - group_name: .classId (Class Identifier)
    requirement: Mandatory
    fields:
    - Word: '3'
      Bit: '31:27'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .padBitCount
      Function: "Number of pad bits (0\u202631) at the end of the packet to hit a 32-bit word boundary. Not used by Base Set."
    - Bit: '26:24'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits26to24
      Function: Reserved
    - Bit: '23:0'
      Bit Used: B
      Default Value: '0xAAAAAA'
      Range: '0xAAAAAA'
      Designation: .oui
      Function: Organization Number. Organizationally Unique Identifier (OUI),  "A 24-bit number that uniquely identifies
        a vendor, manufacturer, or other organization globally or worldwide"
    - Word: '4'
      Bit: '31:24'
      Bit Used: B
      Default Value: '0x05'
      Range: '4:5'
      Designation: .infoClassCode_Type
      Function: 0 => Unknown; 1 => TxComm, 2 => RxComm, 3 => Sensor;  4 => TxComm base set; 5 => RxComm Base Set; 6 => TxComm
        extended set 1; 7 => RxComm extended set 1; 8 => TxComm  extended set 2; 9 => RxComm extended set 2; (10-255) => TBD
    - Bit: '23:16'
      Bit Used: B
      Default Value: '0x00'
      Range: 0:2^8-1
      Designation: .infoClassCode_Version
      Function: Version number of information class
    - Bit: '15:8'
      Bit Used: B
      Default Value: '0x0E'
      Range: '0x0E'
      Designation: .packetClassCode_Type
      Function: 'Defined PacketTypes:  0x00 => undefined, 0x0A => Base Set Control ScheduleRequest, 0x0B => Base Set Schedule
        Acknowledge (AckR),  0x0C => Base Set Execution Acknowledge (AckX), 0x0D => Base Set Data, 0x0E => Base Set DataContext'
    - Bit: '7:0'
      Bit Used: B
      Default Value: '0x05'
      Range: 0:2^8-1
      Designation: .packetClassCode_Version
      Function: Version of Packet Class definition for specified type
  - group_name: .timeStamp (Time Stamp)
    requirement: Mandatory
    fields:
    - Word: '5'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^32-1
      Designation: .tsi
      Function: Integer time stamp, UTC seconds since midnight, Jan. 1, 2019
    - Word: '6'
      Bit: '63:32'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^64-1
      Designation: .tsf
      Function: Fractional time stamp most-significant (Upper 32 bits); format indicated by header.tsf, picoseconds since
        last seconds update
    - Word: '7'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Function: Fractional time stamp least-significant (Lower 32 bits); format indicated by header.tsf, picoseconds since
        last seconds update
      Designation: .tsfLower
  - group_name: .cif0 (Control Indicator Field 0, Legacy Fields)
    requirement: Mandatory
    notes: See Cotrol-Context Payload Formats
    fields:
    - Word: '8'
      Bit: '31'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cfci
      Function: 'Context field change indicator: Control packets are only sent when something needs to be changed so this
        should be set to 1'
      Field Size (words): '0'
    - Bit: '30'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .rpi
      Function: Reference point identifier
    - Bit: '29'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .bandwidth
      Function: 3 dB Bandwidth
      Field Size (words): '2'
    - Bit: '28'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .ifRefFreq
      Function: IF reference frequency.  This is the digital frequency offset within the superchannel of the transmission
        burst.  It is referenced to the center of the superchannel.  Hence the ifRefFreq can be positive or negative.
      Field Size (words): '2'
    - Bit: '27'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .rfRefFreq
      Function: RF reference frequency.  This is the center of the superchannel and will always be a large positive number.
      Field Size (words): '2'
    - Bit: '26'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .rfRefFreqOffset
      Function: Offset from RF Ref Freq of RF frequency that translates to/from IF Ref Freq
      Field Size (words): '2'
    - Bit: '25'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .ifBandOffset
      Function: IF band offset
      Field Size (words): '2'
    - Bit: '24'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .refLevel
      Function: CIF0/24 Reference level relates digital signal amplitude to analog signal power. An analog Reference Point
        and location for the digital Described Signal must be defined in system documentation. The Reference Level is the
        AC power of a single analog sine wave at the reference point that produces a unit-scale digital sine wave as the Described
        Signal. Note that a unit scale sine wave for N-bit two's complement data is defined as one with amplitude ranging
        from -2^(N-1) to +2^(N-1), which exceeds the available range of an N-bit two's complement number at its peak value.
      Field Size (words): '1'
    - Bit: '23'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .gain
      Function: Gain bits 31:16 are not used in the base set and shall be set to 0. Bits 15:0 should be used in Base Set Rx
        Schedule Requests to control signal amplitude into the MFA ADC. Context Packet Gain Bits 15:0 shall be used to indicate
        the MFA  Gain setting, which may differ from the requested value. Gain Bits shall not be used on Tx, as it will conflict
        with EIRP (figure of merit, CIF 4/29). Gain bits 15:0 shall be set to 0 in Tx Schdule Request and Context Packets.
      Field Size (words): '1'
    - Bit: '22'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .overRangeCount
      Function: Over-range count
    - Bit: '21'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .sampleRate
      Function: Sample rate in Hz
      Field Size (words): '2'
    - Bit: '20'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .tsa
      Function: Time stamp adjustment
    - Bit: '19'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .tsCalTime
      Function: Time stamp calibration time
    - Bit: '18'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .temp
      Function: Temperature
    - Bit: '17'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .deviceId
      Function: Device identifier
    - Bit: '16'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .sei
      Function: State and Event Indicator. Eight predefined indicator bits with corresponding enable bits, plus 8 user-defined
        bits. Bits 28 and 16 indicate whether AGC is in use. See [2] Table 9.10.8-1. Not currently in use.
      Field Size (words): '1'
    - Bit: '15'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .dataFormat
      Function: Signal data packet payload format.  We should always send the data packet format
      Field Size (words): '2'
    - Bit: '14'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .gps
      Function: Formatted GPS
    - Bit: '13'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ins
      Function: Formatted INS
    - Bit: '12'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ecef
      Function: ECEF ephemeris
    - Bit: '11'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .relativeEphemeris
      Function: Relative ephemeris
    - Bit: '10'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ephemerisRefId
      Function: Ephermeris reference ID
    - Bit: '9'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .gpsAscii
      Function: GPS ASCII
    - Bit: '8'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .contextAssocLists
      Function: Context association lists
    - Bit: '7'
      Bit Used: N
