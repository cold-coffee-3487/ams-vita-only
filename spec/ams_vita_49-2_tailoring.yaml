  - group_name: .payloadFields
    requirement: Mandatory
    notes: Payload fields are defined by enabled CIF indicators and the Control-Context Payload Formats table. Payload fields
      are included in CIF-bit order and may contain additional fields from Extension Set. This group is a metadata placeholder
      and has no fixed rows.
