      Range: 0:1
      Designation: .notExecuted
      Function: Field not executed due to warning or error
    - Bit: '30'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .deviceFailure
      Function: Field not executed properly  due to a device failure
    - Bit: '29'
      Bit Used: B
