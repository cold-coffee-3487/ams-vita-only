      Range: 0:1
      Designation: .badTimestamp
      Function: Controllee was unable to meet the timestamp requirement specified by the [T2,T1,T0] bits for the specified
        field.
    - Bit: '24'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .hazardousPowerLevels
      Function: Supplied field will cause transmission of hazardous power levels
    - Bit: '23'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .distortion
      Function: Supplied field will cause components to be over driven eading to distortion
    - Bit: '22'
      Bit Used: B
