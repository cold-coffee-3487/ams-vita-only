      Designation: .inBandPowerCompliance
      Function: Supplied field will place the in-band power levels out of compliance
      Bit Used: N
    - Bit: '21'
      Default Value: '0'
      Designation: .outOfBandPowerCompliance
      Function: supplied field will place the out-of-band power levels out of compliance
      Bit Used: N
      Range: 0:1
    - Bit: '20'
      Default Value: '0'
      Range: 0:1
      Designation: .coSiteInterference
      Function: Supplied field will cause co-site interference between transmitter and receiver at same location
      Bit Used: N
    - Bit: '19'
      Default Value: '0'
      Range: 0:1
      Designation: .regionalInterference
      Function: Supplied field will cause interference between devices in same operational region
      Bit Used: N
    - Bit: '18:13'
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits18to13
      Function: Reserved
      Bit Used: N
    - Bit: '12:1'
      Default Value: '0'
      Range: 0:1
      Designation: .userDefinedWarningErrors
      Function: User specified custom error types
      Bit Used: N
    - Bit: '0'
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit0
      Function: Reserved
      Bit Used: N
  - group_name: .errorPayloadFields
    requirement: Variable
    notes: A variable number of error payload fields are included to describe errors flagged in EIF fields. Error payload
      fields are provided in the same order as the EIF bits. See Error Payload Fields.
    fields:
    - Word: '15'
      Bit: '31'
      Bit Used: B
