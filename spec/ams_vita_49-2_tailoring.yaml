  - group_name: .eif1 (Error indicator field has same structure as Control Packet's Control Indicator Fields)
    requirement: Optional
    notes: EIF1 shall  be present in AckX packets when a CIF 1 field causes an error. EIF 1 structure is the same as in the
      associated Extension Control (Schedule Request) packet CIF 1 Structure. An EIF bit shall be set to 1 when there is an
      error message for an associated field. Associated-field error messages all follow the 32-bit warning/error format below.
    fields:
    - Word: '11'
      Bit: '30'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .polarization
      Function: "Polarization: Upper bits 31:16 indicate polarization ellipse tilt angle, lower bits 15:0 indicate ellipse\
        \ eccentricity. Both are measured in radians. Tilt angle is the angle of the polarization-ellipse major axis  measured\
        \ counter-clockwise from the array/antenna plane positive x-axis [2,4], with the x-axis defined in system documentation.\
        \ Ellipticity describes the eccentricity of the polarization ellipse, including direction of rotation where appropriate.\
        \ Linear polarization is described by ellipticity = \u03C0/4. For tilt = 0 linear polarization is horizontal, and\
        \ for tilt = \u03C0/2 linear polarization is vertical, thus horzontal polarization is parallel to the antenna x-axis,\
        \ and vertical polarization parallel to the antenna y-axis, both as defined in system documentation.  Ellipticity\
        \ = 0 indicates right-handed circular polarization, and ellipticity = \u03C0/2 indicates left-handed circular polarization,\
        \ where left- or right-handed rotation shall be defined  from the point of view of an observer at the receiver looking\
        \ toward the transmitter [2,4].  Note that the direction in which tilt angle is measured, and the definitions of left-\
        \ and right-handed rotation are inconsistent with IEEE standards [3]."
      Field Size (words): '1'
    - Bit: '29'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .pointing3d
      Function: "3-D pointing vector. Indicates pointing beam direction relative to the assigned aperture boresight. 3D pointing\
        \ has two subfields: Bits 31:16 are elevation, bits 15:0 are azimuth, both in the antenna frame of reference. Define\
        \ antenna boresight as the z-axis, the x axis is orthogonal to z and \"horizontal\" in the frame of reference defined\
        \ by the antenna. The y axis points \"up\" in the antenna frame and is 90\xB0 clockwise from the x axis when looking\
        \ out along boresight. Elevation is measured up (positive y direction) from the x-z plain to the pointing vector.\
        \ Azimuth is measured in the x-z plain, between the projection of the pointing vector onto the x-z plain and boresight.\
        \  Positive azimuth angles are measured clockwise from boresight when looking down (from positive y toward the x-z\
        \ plain)."
      Field Size (words): '1'
    - Bit: '25'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .beamWidth
      Function: 'Beamwidth: Indicate the desired beamwidth'
      Field Size (words): '1'
  - group_name: .eif2 (Error indicator field has same structure as Control Packet's Control Indicator Fields)
    requirement: Optional
    notes: EIF2 shall  be present in AckX packets when a CIF 2 field causes an error. EIF 2 structure is the same as in the
      associated Extension Control (Schedule Request) packet CIF 2 Structure. An EIF bit shall be set to 1 when there is an
      error message for an associated field. Associated-field error messages all follow the 32-bit warning/error format below.
    fields:
    - Word: '12'
      Bit: '6'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .funcPriorityId
      Function: Function priority ID for resolving conflicting requests to use MFA resources. Unsigned 32-bit integer, bigger
        is higher priority
      Field Size (words): '1'
  - group_name: .eif3 (Error indicator field has same structure as Control Packet's Control Indicator Fields)
    requirement: Optional
    notes: EIF3 shall  be present in AckX packets when a CIF 3 field causes an error. EIF 3 structure is the same as in the
      associated Extension Control (Schedule Request) packet CIF 3 Structure. An EIF bit shall be set to 1 when there is an
      error message for an associated field. Associated-field error messages all follow the 32-bit warning/error format below.
    fields:
    - Word: '13'
      Bit: '21'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .dwell
      Function: Dwell duration in femtoseconds, where Dwell is the duration of a requested transmitter or receiver event,
        i.e. the transmitter or receiver has exclusive use of an assigned aperture. If Schedule Request type schReqType=1,
        a dwell shall begin at the Schedule Request TimeStamp and last for Dwell femtoseconds. For receive events all data
        samples received during a dwell will be sent to the requesting skill. For transmit events the aperture may transmit
        one or more data bursts during a dwell, with burst durations defined by the data packet time stamp and size, provided
        all bursts are entirely contained within the dwell. The dwell value ranges from 0 to ~9223 s ( ~154 minutes).
      Field Size (words): '2'
  - group_name: .eif4 (Error indicator field has same structure as Control Packet's Control Indicator Fields)
    requirement: Optional
    notes: EIF4 shall  be present in AckX packets when a CIF 4 field causes an error. EIF 4 structure is the same as in the
      associated Extension Control (Schedule Request) packet CIF 4 Structure. An EIF bit shall be set to 1 when there is an
      error message for an associated field. Associated-field error messages all follow the 32-bit warning/error format below.
    fields:
    - Word: '14'
      Bit: '29'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .rfFigureOfMerit
      Function: Requested input G/T (dB/K) range for Rx, requested EIRP (dBm) range on Tx.  The MFA shall, to the best of
        its ability, meet the EIRP or G/T request in the lower 16 bits of this word (bits 15:0) at any pointing angle inside
        the documented aperture Field of Regard. Calculation of EIRP or G/T values  supported by an MFA shall include the
        effects of scan angle, beamwidth, and frequency, as appropriate. The EIRP calculation shall include polarization mismatch
        only if transmit polarization realized is different from polarization requested, in which case it shall be assumed
        the receiver is configured for the requested polarization. G/T calculation shall not include the effects of external
        noise. The MFA shall provide an EIRP  as close to the requested value (bits 15:0) as possible without exceeding it.
        If the maximum available EIRP is below the lower limit in bits 31:16, the MFA shall reject the schedule request. Requests
        with pointing angle and/or other parameters that result in G/T below the value provided in the upper 16 bits (bits
        31:16) shall be rejected by the scheduler. Configurations producing G/T greater than the requested value (bits 15:0)
        may be allowed.  Note that VITA 49.2 defines polariation angles and rotation from the point of view of an observer
        at the receiver, rather than at the transmitter as in [3].
      Field Size (words): '1'
    - Bit: '24'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .addressGroupIndex
      Function: Provides a look-up index that points to a collection of MFP address for data and Ack packets associated with
        this Schedule Request. That is one or more data packet stream(s) with SID matching the Control SID, or  SID's identified
        by the SID or index in the field (2/30) .citedSID. Plus AckR and AckX packet streams with SID matching the Control
        SID.  The corresponding MFA addresses are in the same field (CIF 4, Bit 24) of the corresponding AckR packet.
      Field Size (words): '1'
    - Bit: '21'
      Bit Used: B
      Default Value: '1'
      Range: 0:1
      Designation: .txDigitalInputPower
      Function: Bits 15:0 contain Nominal power level of digital TX signal input to MFA for transmission, dBfs, where "full
        scale power" shall be defined as the power of a complex digital sinusoid with amplitude equal to full scale. Set to
        0 for Rx. Set bits 31:16 to 0.
      Field Size (words): '1'
  - group_name: .eif7 (Error indicator field has same structure as Control Packet's Control Indicator Fields)
    requirement: Forbidden
    notes: EIF7 is not supported in the Baseline AckX packet
    fields:
    - Word: N/A
      Bit: '31:0'
      Bit Used: N
      Default Value: '0'
      Range: 0:1
      Designation: .eif7
      Function: Error fields follow the 32-bit warning/error format below.
  - group_name: .wifPayloadFields  (The following is an example of a warning field whose presence is indicated by the WIFs)
    requirement: Forbidden
    notes: Warning Payload Fields are not supported in the Base Set
    fields:
    - Word: N/A
      Bit: '31'
      Default Value: '0'
      Designation: .notExecuted
      Function: Field not executed due to warning or error
      Bit Used: N
      Range: 0:1
    - Bit: '30'
      Default Value: '0'
      Designation: .deviceFailure
      Function: Field not executed properly  due to a device failure
      Bit Used: N
      Range: 0:1
    - Bit: '29'
      Default Value: '0'
      Designation: .erroneousField
      Function: Device does not support the field
      Bit Used: N
      Range: 0:1
    - Bit: '28'
      Default Value: '0'
      Designation: .outOfRange
      Function: Supplied field value is beyond the capability or operational range of this device
      Bit Used: N
      Range: 0:1
    - Bit: '27'
      Default Value: '0'
      Designation: .unsupportedPrecision
      Function: Supplied field value specifies a level of precision beyond the capability of this device
      Bit Used: N
      Range: 0:1
    - Bit: '26'
      Default Value: '0'
      Designation: .invalidValue
      Function: Field had an invalid setting beyond those specified above
      Bit Used: N
      Range: 0:1
    - Bit: '25'
      Default Value: '0'
      Range: 0:1
      Designation: .badTimestamp
      Function: Controllee was unable to meet the timestamp requirement specified by the [T2,T1,T0] bits for the specified
        field.
      Bit Used: N
    - Bit: '24'
      Default Value: '0'
      Range: 0:1
      Designation: .hazardousPowerLevels
      Function: Supplied field will cause transmission of hazardous power levels
      Bit Used: N
    - Bit: '23'
      Default Value: '0'
