        during long Rx dwells
      Field Size (words): '2'
    - Bit: '24'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .addressGroupIndex
      Function: Provides a look-up index that points to a collection of MFP address for data and Ack packets associated with
        this Schedule Request. That is one or more data packet stream(s) with SID matching the Control SID, or  SID's identified
        by the SID or index in the field (2/30) .citedSID. Plus AckR and AckX packet streams with SID matching the Control
        SID.  The corresponding MFA addresses are in the same field (CIF 4, Bit 24) of the corresponding AckR packet.
      Field Size (words): '1'
      Notes: AGI points to a table with variable a number of entries. Minimum entry is a default address. Every packet sent
        to the Skill for which an address has not been specified will be sent to the default address. Other possible values
        include but are not limited to Data Address Index (DAI), Control Address Index (CAI), and Context Address Index) (XAI).
    - Bit: '23'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .dataAddressStructure
      Function: An array of records listing all the data streams associated with this control packet stream by data stream
        SID and MFP address. When present it may replace the information in (2/30) .citedSID and always replaces the information
        in (4/24) dataAddressIndex. The corresponding MFA addresses are contained in the same field location (4/23) of the
        AckR packet returned in response to this packet. This array provides greater flexibility than using .citedSId and
        .dataAddressIndex at the cost of variable-length control packets. The array header consists of the 3 mandatory header
        words (see reference or Change Notes) plus a variable number of records consisting of 1 or 2 words (SID, MFP Address
        Index) or  (MFP Address Index) as indicated in header word 3.
      Notes: Data Address Index and Data Address Structure both indicate the MFP data addresses to which received data should
        be provided. These two fields are mutually exclusive, consequently at most one field may have a non-zero CIF bit
      Field Size (words): '-1'
    - Bit: '22'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .dataAddressTime
      Function: If the data address(es) of 4/24 or 4/23 are not immediately applicable (e.g., If the MFA must switch antenna
        faces during a stream of VITA data packets transporting one long Rx/Tx packet, the MFA scheduler may send a new AckR
        packet with the new MFA port addresses with some lead time before the change), The .dataAddressTime parameter indicates
        when the data address information in 4/24 or 4/23 becomes applicable. Offset from time stamp.
      Field Size (words): '2'
    - Bit: '21'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .txDigitalInputPower
      Function: Bits 15:0 contain Nominal power level of digital TX signal input to MFA for transmission, dBfs, where "full
        scale power" shall be defined as the power of a complex digital sinusoid with amplitude equal to full scale. Set to
        0 for Rx. Set bits 31:16 to 0.
      Field Size (words): '1'
      Notes: This parameter combined with rfFigureOfMerit (EIRP) may be used by the MFA to calculate required MFA internal
        gain during  transmission.  The value supplied may be a long-term average (multiple Tx bursts), the measured power
        of the digital data burst being scheduled, or an  arbitrary value. For example, if short-term TX EIRP is variable,
        and the Skill implements rapid power control by varying the amplitude of the digital signal it inputs to the MFA,   then  txDigitalInputPower
        should be set to a value such that maximum expected MFA input digital power results in an RF transmit power value
        no greater than the specified maxium EIRP.
    - Bit: '20:0'
      Designation: .reservedBits20to0
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Function: Reserved for future cif extensions
