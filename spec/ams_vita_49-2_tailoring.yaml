  - group_name: .eif0 (Error indicator field has same structure as Control Packet's Control Indicator Fields)
    requirement: Optional
    notes: EIF0 shall  be present in AckX packets when an error condition occurs. The error may be associated with any field,
      or may not be assoicated with a specific field. When there is no error reported, EIF 0 it is not present. EIF 0 structure
      is the same as in the associated Extension Control (Schedule Request) packet CIF 0 Structure. An EIF bit shall be set
      to 1 when there is an error message for an associated field.  Associated-field error messages all follow the 32-bit
      warning/error format below.
