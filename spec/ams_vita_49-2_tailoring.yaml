  - group_name: .cif4 (Control Indicator Field 4 - Extension Fields)
    requirement: Mandatory
    notes: See Cotrol-Context Payload Formats
    fields:
    - Word: '14'
      Bit: '31'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit31
