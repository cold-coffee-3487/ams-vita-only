      Field Size (words): '2'
    - Bit: '26'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .rejectReason
      Function: '32 bit enumeration of reasons that this control was rejected by the scheduler. The first 8 bits indicated
        the requested parameter that caused a failure. Bits 31:29 are the failed parameter CIF # as a 3-bit unsigned integer,
        except that bits 31:29 = 111 indicates the failure is not tied to a specific parameter. Bits 28:24 indicate the failed
        parameter CIF Bit # as a 5-bit unsigned integer, and are all 0 if bits 31:29 = 111. Bits 23:0 form a 24-bit unsigned
        integer that describes the failure mode. See the Reject Reason Enumeration tab .'
      Field Size (words): '1'
      Notes: rejectReason describes the reason a Schedule Request was rejected by the VAS, i.e. was not scheduled. In this
        case .schX (Ack Packet CAM bit 10) = 0 indicationg schedule failure. Failures that occur after a request was schduled
        (schX=1) are reported by AckX packets.
    - Bit: '25'
      Bit Used: E
