      Default Value: '0'
      Designation: .precision
      Function: Precision
    - Bit: '24'
      Bit Used: N
      Default Value: '0'
      Designation: .accuracy
      Function: Accuracy
    - Bit: '23'
      Bit Used: N
      Default Value: '0'
      Designation: .velocity
      Function: 1st Derivative (velocity)
    - Bit: '22'
      Bit Used: N
      Default Value: '0'
      Designation: .acceleration
      Function: 2nd Derivative (acceleration)
    - Bit: '21'
      Bit Used: N
      Default Value: '0'
      Designation: .jerk
      Function: 3rd Derivative (jerk)
    - Bit: '20'
      Bit Used: N
      Default Value: '0'
      Designation: .probability
      Function: Probability
    - Bit: '19'
      Bit Used: N
      Default Value: '0'
      Designation: .belief
      Function: Belief
    - Bit: '18:0'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits18to0
      Function: Reserved
  - group_name: .payloadFields
    requirement: Mandatory
    notes: Payload fields are defined by enabled CIF indicators and the Control-Context Payload Formats table. Payload fields
      are included in CIF-bit order and shall match the size and format of corresponding payload fields in the Extension Control
      Packet. This group is a metadata placeholder and has no fixed rows.
    fields: []
- title: Data Packet
  text: Control-Cancellation Packet Template
  groups:
  - group_name: .header
    requirement: Mandatory
    fields:
    - Word: '1'
      Bit: '31:28'
      Bit Used: B
      Default Value: '0001'
      Range: '0001'
      Designation: .type
      Function: 'Packet Type: 0001 => Signal Data Packet with Stream Identifier; Type 0000 =>  Signal Data Packet without
        Stream Identifier'
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '27'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cBit
      Function: Indicates whether CLASS ID is included in the prologue
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '26'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .tBit
      Function: Indicates whether this packet has a trailer word
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '25'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .notV49p0Packet
      Function: Indicates whether this is a VITA 49.0 compliant packet
      Time Determined: N/A
      Time When Payload Value Determined: N/A
    - Bit: '24'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .sBit
      Function: Indicates whether packet contains spectrum data
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '23:22'
      Bit Used: B
      Default Value: '11'
      Range: '11'
      Designation: .tsi
      Function: 'Indicates: 00 No int seconds time stamp, 01 => UTC, 10 => GPS, 11 => Other'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '21:20'
      Bit Used: B
      Default Value: '10'
      Range: '10'
      Designation: .tsf
      Function: 'Indicates: 00 => No frac seconds field, 01 => sample count, 10 => picoseconds, 11 => free running count'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '19:16'
      Bit Used: B
      Default Value: '0'
      Range: 0:15
      Designation: .packetCount
      Function: 4-Bit Packet sequence number for this packet type in this streamID
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '15:0'
      Bit Used: B
      Default Value: N/A
      Range: 0:2^16-1
      Designation: .packetSize
      Function: Total number of 32-bit words in the packet including the prologue; computed from the final packet word count.
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
  - group_name: .streamId (Stream Identifier)
    requirement: Mandatory
    fields:
    - Word: '2'
      Bit: '31:0'
      Bit Used: B
      Default Value: '1'
      Designation: .sid
      Function: Stream ID provided in associated AckR packets used to schedule access.
      Time Determined: VA Initialization
      Time When Payload Value Determined: N/A
  - group_name: .classId (Class Identifier)
    requirement: Mandatory
    fields:
    - Word: '3'
      Bit: '31:27'
      Bit Used: N
      Default Value: '0'
      Range: 0:2^5-1
      Designation: .padBitCount
      Function: "Number of pad bits (0\u202631) at the end of the packet to hit a 32-bit word boundary. Not used by Base Set.\
        \  16-bit I/Q samples always fill each word."
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '26:24'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits26to24
      Function: Reserved
      Time Determined: N/A
      Time When Payload Value Determined: N/A
    - Bit: '23:0'
      Bit Used: B
      Default Value: '0xAAAAAA'
      Range: '0xAAAAAA'
      Designation: .oui
      Function: Organizationally Unique Identifier (OUI)
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Word: '4'
      Bit: '31:24'
      Bit Used: B
      Default Value: '0x04'
      Range: '4:5'
      Designation: .infoClassCode_Type
      Function: 0 => Unknown; 1 => TxComm, 2 => RxComm, 3 => Sensor;  4 => TxComm base set; 5 => RxComm Base Set; 6 => TxComm
        extended set 1; 7 => RxComm extended set 1; 8 => TxComm  extended set 2; 9 => RxComm extended set 2; (10-255) => TBD
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '23:16'
      Bit Used: B
      Default Value: '0x00'
      Range: 0:2^8-1
      Designation: .infoClassCode_Version
      Function: Version number of information class
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '15:8'
      Bit Used: B
      Default Value: '0x0D'
      Range: '0x0D'
      Designation: .packetClassCode_Type
      Function: 'Defined PacketTypes:  0x00 => undefined, 0x0A => Base Set Control ScheduleRequest, 0x0B => Base Set Schedule
        Acknowledge (AckR),  0x0C => Base Set Execution Acknowledge (AckX), 0x0D => Base Set Data, 0x0E => Base Set DataContext'
    - Bit: '7:0'
      Bit Used: B
      Default Value: '0x05'
      Range: 0:2^8-1
      Designation: .packetClassCode_Version
      Function: Version of Packet Class definition for specified type
  - group_name: .timeStamp (Time Stamp)
    requirement: Mandatory
    fields:
    - Word: '5'
      Bit: '31:0'
      Bit Used: B
      Default Value: '1'
      Range: 0:2^32-1
      Designation: .tsi
      Function: UTC seconds since midnight, Jan. 1, 2019
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
    - Word: '6'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^32-1
      Designation: .tsf
      Function: Most-significant (Upper 32 bits) pico seconds since last seconds update
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
    - Word: '7'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^32-1
      Function: Least-significant (Lower 32 bits) pico seconds since last seconds update
      Designation: .tsfLower
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
  - group_name: .dataPayload (Signal Data Payload Words)
    requirement: Mandatory
    notes: Signal data payload is variable-length and encoded according to .dataFormat. See Payload Formats for specific data
      format information. This group is a metadata placeholder and has no fixed per-word rows.
    fields: []
  - group_name: .trailer
    requirement: Mandatory
    fields:
    - Word: N+1
      Bit: '31'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .calibratedTimeIndicatorEnable
      Function: Calibrated-time trailer reporting is not used in the AMS Base Set; set to zero
    - Bit: '30'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .validDataIndicatorEnable
      Function: Valid-data trailer reporting is not used in the AMS Base Set; set to zero
    - Bit: '29'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .referenceLockIndicatorEnable
      Function: Enables whether bit 17 indicates a valid status
    - Bit: '28'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .agcIndicatorEnable
      Function: Enables whether bit 16 indicates a valid status
    - Bit: '27'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .detectedSignalIndicatorEnable
      Function: Enables whether bit 15 indicates a valid status
    - Bit: '26'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .spectralInversionIndicatorEnable
      Function: Spectral inversion trailer reporting is not used in the AMS Base Set; set to zero
    - Bit: '25'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .overRangeIndicatorEnable
      Function: Enables whether bit 13 indicates a valid status
    - Bit: '24'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .sampleLossIndicatorEnable
      Function: Enables whether bit 12 indicates a valid status
    - Bit: '23:22'
      Bit Used: B
      Default Value: '11'
      Range: 0:3
      Designation: .sampleFrameIndicatorEnables
      Function: Enables whether bits 11:10 below (.sampleFrameIndicators) contain valid status bits. Bits 23:22 => 11 then
        Bits 11:10 indicate the packet's role in transporting a large (multi-packet) data frame, where bits 23:22 => 11 and
        bits 11:10 => 00 indicates a single packet caries the entire data frame. Bits 23:22 => any value but 11 then 11:10
        are not valid indicators.
    - Bit: '21:20'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .userDefinedIndicatorEnables
      Function: 1 => Enables user-defined bits 9:8 (.userDefinedIndicators) to indicate user defined  status.
    - Bit: '19'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .calibratedTimeIndicator
      Function: Calibrated-time trailer reporting is not used in the AMS Base Set; set to zero
    - Bit: '18'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .validDataIndicator
      Function: Valid-data trailer reporting is not used in the AMS Base Set; set to zero
    - Bit: '17'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .referenceLockIndicator
      Function: 1 =>(and bit 29 => 1), shall indicate that any phase-locked loops affecting the Data are locked and stable.
        0 =>  (and bit 29 => 1) indicates at least one PLL is not locked and stable.
    - Bit: '16'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .agcIndicator
      Function: 1 => (and bit 28 => 1),  indicates that AGC is active.  0 => (and bit 28 => 1),  indicates MGC.
    - Bit: '15'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .detectedSignalIndicator
      Function: 1 => (and bit 27 => 1), indicates the data contained in the packet contains some detected signal. 0 =>  (and
        bit 27 => 1), indicates the packet does not contain some detected signal.
    - Bit: '14'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .spectralInversionIndicator
      Function: 1 => (and bit 26 => 1),indicates  the signal conveyed in the data payload has an inverted spectrum with respect
        to the spectrum of the signal at the system Reference Point.
    - Bit: '13'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .overRangeIndicator
      Function: 1 => (and bit 25 => 1),indicates that at least one Data Sample in the payload is invalid due to the signal
        exceeding the range of the Data Item.
    - Bit: '12'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .sampleLossIndicator
      Function: 1 => (and bit 24 => 1), indicates the packet contains at least one sample discontinuity due to processing
        errors and/or buffer overflow.
    - Bit: '11:10'
      Bit Used: B
      Default Value: '00'
      Range: '00, 01,

        10, 11'
      Designation: .sampleFrameIndicators
      Function: When bits 23:22 => '11' then bits 11:10 indicate this data packet's position in a data frame spanning mulitple
        data packets. Bits 11:10 = '00' => sample frame is one data packet, '01' => First data packet of a sample frame, '10'
        => Middle data packet of a sample frame, '11' => Final data packet of a sample frame. If a data stream is preempted
        in the middle of a data frame spanning mulitple data packets, bits 11:10 in the last data packet sent shall be '11'.
    - Bit: '9:8'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .userDefinedIndicators
      Function: 00, 01, 10, 11 are user defined status states of the data packet.
    - Bit: '7'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .eBit
      Function: Associated Context Packet Count Enable. When the E bit is set to 1, the Associated Context Packet Count shall
        provide a count of all of transmitted Context packets that are directly or indirectly associated with the Signal Data
        packet, OR a count of some special subset of these. When the E bit is cleared, the Associated Context Packet Count
        is undefined.
    - Bit: '6:0'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .assocContextPacketCount
      Function: When used, the 7-bit Associated Context Packet Count field shall contain an unsigned number in the range of
        zero to 127 inclusive. The lsb of the number shall be the right-most bit in the field.
- title: Control-Context Payload Formats
  groups:
  - group_name: .payloadFormats
    cif_bit: General
    notes: Supported data formats are exactly 16-bit and 8-bit I/Q signed integers; 1-bit real unsigned and floating-point formats are not supported by the Base Set.
    fields:
    - CIF/Bit: 0/29
      Field Bit: '63:0'
      Designation: .bandwidth
      Function: "CIF0/29 3 dB Bandwidth in Hz.  The Bandwidth field shall use the 64-bit, two\u2019s-complement format.  This\
        \ field has an integer and a fractional part with the radix point to the right of bit 20 in the second 32-bit word."
      Field Size (words): '2'
    - Field Bit: '63:0'
      Designation: .ifRefFreq
      Function: "CIF0/28 IF reference frequency in Hz.  The IF reference frequency field shall use the 64-bit, two\u2019s-complement\
        \ format.  This field has an integer and a fractional part with the radix point to the right of bit 20 in the second\
        \ 32-bit word.  For real data samples it is in the range 0  to Fs/2, for complex data samples it is in the range -Fs/2\
        \ to +Fs/2."
      Field Size (words): '2'
    - CIF/Bit: 0/27
      Field Bit: '63:0'
      Designation: .rfRefFreq
      Function: "CIF0/27 RF reference frequency in Hz.  The RF reference frequency field shall use the 64-bit, two\u2019s-complement\
        \ format.  This field has an integer and a fractional part with the radix point to the right of bit 20 in the second\
        \ 32-bit word."
      Field Size (words): '2'
    - Field Bit: '63:0'
      Designation: .rfRefFreqOffset
      Function: "CIF0/26 RF Frequency of Interest offset from RF Reference Frequency in Hz. The RF Reference Frequency Offset\
        \ field shall use the 64-bit, two\u2019s-complement format.  This field has an integer and a fractional part with\
        \ the radix point to the right of bit 20 in the second 32-bit word."
      Field Size (words): '2'
    - Field Bit: '31:0'
      Designation: .refLevel
      Function: "CIF0/24  The upper 16 bits of this field are reserved and shall be set to zero. The Reference Level value\
        \ shall be expressed in two\u2019s-complement format in the lower 16 bits of this field. This field has an integer\
        \ and a fractional part, with the radix point to the right of bit 7."
      Field Size (words): '1'
    - Field Bit: '63:0'
      Designation: .ifBandOffset
      Function: "CIF0/25 Offset of IF band center from ifRefFreq in Hz. The RF reference frequency field shall use the 64-bit,\
        \ two\u2019s-complement format.  This field has an integer and a fractional part with the radix point to the right\
        \ of bit 20 in the second 32-bit word. Value may be postivie or negative."
      Field Size (words): '2'
    - Field Bit: '31:16'
      Designation: .reservedBits31to16
      Function: CIF0/24
    - Field Bit: '15:0'
      Designation: .refLevelStage1
      Function: "CIF0/24 Reference Level, units dBm. Reference Level value shall be expressed in two\u2019s-complement format\
        \ in the lower 16 bits of the Reference Level field. This subfield has an integer and a fractional part, with the\
        \ radix point to the right of bit 7 of the subfield. Referemce Level relates digital signal amplitude to analog signal\
        \ power. An analog Reference Point and location for the digital Described Signal must be defined in system documentation.\
        \ The Reference Level is the AC power of a single analog sine wave at the reference point that produces a unit-scale\
        \ digital sine wave as the Described Signal. Note that a unit scale sine wave for N-bit two's complement data is defined\
        \ as one with amplitude ranging from -2^(N-1) to +2^(N-1), which exceeds the available range of an N-bit two's complement\
        \ number at its peak value."
      Field Size (words): '1'
    - Field Bit: '31:16'
      Designation: .gainStage2
      Function: CIF0/23 This field is unused in our implementation
      Field Size (words): '1'
    - Field Bit: '15:0'
      Designation: .gainStage1
      Function: "CIF0/23 The Stage 1 Gain subfield shall be expressed in units of decibels (dB). The Stage 1 Gain value shall\
        \ be expressed in two\u2019s-complement format in the lower 16 bits of the Gain field. This subfield has an integer\
        \ and a fractional part, with the radix point to the right of bit 7 of the subfield. Gain is defined as the ratio\
        \ of Described Signal power (output) to signal power at the Reference Point (input), in dB. The Reference Point and\
        \ Described Signal location must be defined in system documentation. Typical values are the antenna feed and ADC/DAC\
        \ analog input/output. Gain may apply to pairs of analog signals, or pairs of digital signals, but not to mixed-format\
        \ signal pairs. If digital signals have different digital resolution at the Refence Point and Described Signal, signal\
        \ power at each location is normalized by the power of a full-scale sinusoid before calculating Gain."
      Field Size (words): '1'
    - CIF/Bit: 0/23
      Field Bit: '31:16'
      Designation: .gain
      Function: Bits 31:16 (Sometimes called Stage 2 gain, or back-end gain) is not used in the Base Set and shall be set
        to all zeros. When used in an extension set it is measured in dB. This subfield has an integer and a fractional part,
        with the radix point to the right of bit 7 of the subfield. It's value ranges from -256 to +255 in 1/128 dB steps.
      Field Size (words): '1'
    - Field Bit: '15:0'
      Function: Bits 15:0 (Sometimes called Stage 1 gain, or front-end gain, or total gain) is present in  base Set Schedule
        Requests and Context Packets. It is measured in dB.  This subfield has an integer and a fractional part, with the
        radix point to the right of bit 7 of the subfield. It's value ranges from -256 to +255 in 1/128 dB steps. This sub-field
        is used in Schedule Requests and Context Packets for Rx data.When not used, e.g. Tx data or Rx data for systems that
        do not use gain to control signal amplitude into the ADC, it shall be set to all zeros.
      Designation: .gainStage1_BaseSet
    - CIF/Bit: 0/21
      Field Bit: '63:0'
      Designation: .sampleRate
      Function: "CIF0/21 The value of the Sample Rate field shall be expressed in units of Hertz. The Sample Rate field shall\
        \ use the 64-bit, two\u2019s-complement format shown in Figure 9.5.12-1. This field has an integer and a fractional\
        \ part, with the radix point to the right of bit 20 in the second 32-bit word."
      Field Size (words): '2'
    - Field Bit: '31:20'
      Designation: .seiEnables
      Function: 'CIF0/16 State and Event Indicator Field.  We will use the user-defined bits as follows: 7:2 => 000000; bit
        1: 0 => this slot is not the first slot in the slot set, 1 => this slot is the first slot in the slot set; bit 0:  0
        => this is not the last slot in the slot set, 1 => this is the last slot in the slot set.  Note, if there is only
        one slot in the slot set, then both bits will be set to 1.  The middle slots in the slot set will be indicated by
        00'
      Field Size (words): '1'
    - Field Bit: '19:8'
      Designation: .seiIndicators
      Field Size (words): '1'
    - Field Bit: '7:0'
      Designation: .seiUserDefined
      Field Size (words): '1'
    - CIF/Bit: 0/16
      Field Bit: '31:0'
      Designation: .sei
      Function: State and Event Indicator. Eight predefined indicator bits with corresponding enable bits, plus 8 user-defined
        bits. Bits 28 and 16 indicate whether AGC is in use. See [2] Table 9.10.8-1. Not currently in use.
      Field Size (words): '1'
    - CIF/Bit: 0/15
      Field Bit: '63:0'
      Designation: .dataFormat
      Function: CIF0/15 Specifies the packing and content of the samples of the paired Data Packet Stream.  See below for
        more details for subfields of this field.
      Field Size (words): '2'
    - CIF/Bit: 1/30
      Field Bit: '31:16'
      Designation: .polarizationTilt
      Function: "CIF 1/30,  16-bit 2's complement number with radix to the right of bit 29,  in radians. Antenna polarization\
        \  tilt angle, \u03B8, on the Poincar\xE9 sphere. For \u03B8=0 the polariztion ellipse major axis is horizontal, for\
        \ \u03B8=\u03C0/2 the polarization ellipse major axis is vertical. Note that the direction in which \u03B8 is measured,\
        \ defined in [2,4], is not consistent with IEEE standards [3]."
      Field Size (words): '1'
    - Field Bit: '15:0'
      Designation: .polarizationEccentricity
      Function: "CIF 1/30 16-bit 2's complement number with radix to the right of bit 13, in radians. Antenna polarization\
        \ eccentricity angle, \u03C7, on the Poincar\xE9 sphere.  When \u03C7=0 the signal is right-hand circularly polarized,\
        \ \u03C7=\u03C0/4 indicates linear polarization, and \u03C7=\u03C0/2 indicates left-hand curcular polarization, as\
        \ defined in [2,4]. Note that ellipticity in [2,4] is defined  from the point of view of an observer at the receiver\
        \ looking toward the transmitter, which makes the definitions of left- and right- handedness the reverse of IEEE standards\
        \ [3]."
      Field Size (words): '1'
    - CIF/Bit: 1/29
      Field Bit: '31:16'
      Designation: .pointing3dElevation
      Function: "CIF1/29 Bits 31-16 - 16-bit 2's complement number with radix to the right of bit 23. It ranges from -90 to\
        \ +90 degrees with minimum step size 1/128 degree. Define antenna boresight as the z-axis, the x axis is orthogonal\
        \ to z and \"horizontal\" in the frame of reference defined by the antenna. The y axis points \"up\" in the antenna\
        \ frame and is 90\xB0 clockwise from the x axis when looking out along boresight. Elevation is measured up (positive\
        \ y direction) from the x-z plain to the pointing vector."
      Field Size (words): '1'
    - Field Bit: '15:0'
      Designation: .pointing3dAzimuth
      Function: "CIF1/29 bits 15:0 -  16-bit unsigned fixed-point number with radix to the right of bit 7, degrees. It ranges\
        \ from 0 to 511.9921875 degrees with minimum step size 1/128 degree. Define antenna boresight as the z-axis, the x\
        \ axis is orthogonal to z and \"horizontal\" in the frame of reference defined by the antenna. The y axis points \"\
        up\" in the antenna frame and is 90\xB0 clockwise from the x axis when looking out along boresight.  Azimuth is measured\
        \ in the x-z plain, between the projection of the pointing vector onto the x-z plain and boresight.  Positive azimuth\
        \ angles are measured clockwise from boresight when looking down (from positive y toward the x-z plain)."
      Field Size (words): '1'
    - CIF/Bit: 1/26
      Field Bit: '31:16'
      Designation: .spatialRefType
      Function: User Defined Spatial Identifier - not used
      Field Size (words): '1'
    - Field Bit: '15:4'
      Function: Reserved
      Designation: .reserved15to4
    - Field Bit: '3:2'
      Function: 'Frame of Reference: 00 => NED, El above North-East plane, Az clockwise from true North when looking down,
        01 => ECEF in VITA spec, not allowed by VITA 49.2, 10 => Platform Centered, elevation above Longitudinal-Transverse
        plane, azimuth clockwise from longitudeinal vector when looking down, 11 => Array Centered, elevation up from horizontal
        plane, azimuth in horizontal plain, clockwise from biresight when looking down. Not used in Base Set.'
      Designation: .frameOfRef
    - Field Bit: '1:0'
      Function: Beam Type - not used
      Designation: .beamType
    - CIF/Bit: 1/25
      Field Bit: '31:16'
      Designation: .beamWidthElevation
      Function: CIF1/25 16-bit 2's complement with radix to the right of bit 23, horizontal beam width in degrees.The frame
        of Reference is aligned with the beam pointing frame of reference, i.e. horizontal beamwidth is measured parallel
        to the plane in which beam-pointing azimuth is measured and orthogonal to the beam pointing direction.
      Field Size (words): '1'
    - Field Bit: '15:0'
      Designation: .beamWidthAzimuth
      Function: CIF1/25 16-bit 2's complement with radix to the right of bit 7, vertical beam width in degrees. With vertical   beamwidth
        measured orthogonal to horizontal beamwidth and orthogonal to the beam pointing direction.
      Field Size (words): '1'
    - CIF/Bit: 2/26
      Field Bit: '31:0'
      Designation: .citedSid
      Function: CIF2/26 32-bit number with the stream ID of the associated data packet.
      Field Size (words): '1'
    - CIF/Bit: 2/8
      Field Bit: '31:16'
      Designation: .modeIdCurrent
      Function: CIF2/8 Reserved part of the Generic16 bit field.
      Field Size (words): '1'
    - Field Bit: '15:0'
      Function: 'CIF2/8 Mode ID: Used by Multi-Function Capability to indicate possible modes to the MFA.'
      Designation: .modeIdNext
    - Field Bit: '31:0'
      Designation: .eventId
      Function: CIF2/7 The field is used by the Multi-Function Capability  as in the VITA 49.2 specification and is a generic16
        bit field.
      Field Size (words): '1'
    - CIF/Bit: 2/6
      Field Bit: '31:0'
      Designation: .funcPriorityId
      Function: CIF2/6 The Function Priority ID field shall convey the priority of an operation within a Command Packet via
        a Generic16 bit Identifier field. The field is interpreted as an unsigned integer with higher values indicating higher
        priority.
      Field Size (words): '1'
    - CIF/Bit: 3/21
      Field Bit: '63:0'
      Designation: .dwell
      Function: "CIF3/21 Dwell shall use the Fractional Time format of Rule 9.7-1 (not the same as a fractional timestamp)\
        \ It shall be a 64-bit two\u2019s complement integer occupying two consecutive 32-bit words in the packet as shown\
        \ in Figure 9.7-3. The most significant 32 bits shall be in the first of these two words. The LSB of the Dwell Fractional\
        \ Time field shall be 1 femtosecond. Dwell value may range from 0 to ~9223 s (~154 minutes)."
      Field Size (words): '2'
    - Field Bit: '63:0'
      Designation: .jitter
      Function: CIF 3/20 Maximum magnitude of time error for time fields (other than timestamp) in Control Packet, expressed
        in Fractional Time Format (64-bit two's complement integer expressing time interval in femtoseconds)
      Field Size (words): '2'
    - Field Bit: '255:0'
      Range: '8'
      Designation: .shortTermKey
      Function: 8  32 bit integers with transec key.
      Field Size (words): '8'
    - CIF/Bit: 4/29
      Field Bit: '31:16'
      Designation: .rfFigureOfMeritLowerBound
      Function: "rfFigureOfMerit_LowerBound, subfield 31:16, two\u2019s-complement format in the upper 16 bits of the field.\
        \ This subfield has an integer and a fractional part with the radix point to the right of bit 23 of the subfield.\
        \ It's value ranges from -256 to +255 in 1/128 dB or dB/K steps as appropriate. In Schedule Request shall indicate\
        \ the minimum acceptable EIRP on transmit in dBm, or G/T on receive in dB/K.   If the MFA cannot support service with\
        \ EIRP or G/T at or above the Lower Bound, a schedule request shall be rejected. In Context or AckR this sub-field\
        \ is not used and shall be set to 0."
      Field Size (words): '1'
    - Field Bit: '15:0'
      Designation: .rfFigureOfMeritRequested
      Function: "rfFigureOfMerit_Requested subfield 15:0,  two\u2019s-complement format in the lower 16 bits of the field.\
        \ This subfield has an integer and a fractional part, with the radix point to the right of bit 7 of the subfield.\
        \ It's value ranges from -256 to +255 in 1/128 dB or dB/K steps as appropriate. In Schedule Request shall indicate\
        \ requested EIRP on transmit in dBm, or G/T on receive in dB/K. The MFA shall support the requested Tx service with\
        \ EIRP as close as possible to the requested value without exceeding it. The MFA shall support the requested Rx service\
        \ with G/T as close below the requested value as possible, and may support service with G/T above the requested value.\
        \ In Context or AckR (if used) shall indicate value used (Context) or to be used (AckR)."
      Field Size (words): '1'
    - CIF/Bit: 4/28
      Field Bit: '63:0'
      Designation: .earlyStartTime
      Function: "CIF 4/28 this field shall use the Fractional Time format of Rule 9.7-1 (not the same as a fractional timestamp)\
        \ It shall be a 64-bit two\u2019s complement integer occupying two consecutive 32-bit words in the packet as shown\
        \ in Figure 9.7-3. The most significant 32 bits shall be in the first of these two words. The LSB of the Early Start\
        \ Time Fractional Time field shall be 1 femtosecond."
      Field Size (words): '2'
    - CIF/Bit: 4/27
      Field Bit: '63:0'
      Designation: .lateStartTime
      Function: "CIF 4/27 this field shall use the Fractional Time format of Rule 9.7-1 (not the same as a fractional timestamp)\
        \ It shall be a 64-bit two\u2019s complement integer occupying two consecutive 32-bit words in the packet as shown\
        \ in Figure 9.7-3. The most significant 32 bits shall be in the first of these two words. The LSB of the Late Start\
        \ Time Fractional Time field shall be 1 femtosecond."
      Field Size (words): '2'
    - CIF/Bit: 4/26
      Field Bit: '31:0'
      Designation: .rejectReason
      Function: 32 bit unsigned integer enumeration of reason that control was rejected. See Reject Reason Enumeration Tab.
      Field Size (words): '1'
    - CIF/Bit: 4/25
      Field Bit: '63:0'
      Designation: .maxDataPacketDwell
      Function: "CIF 4/25 MaxDataPacketDwell shall use the Fractional Time format of Rule 9.7-1 (not the same as a fractional\
        \ timestamp) It shall be a 64-bit two\u2019s complement integer occupying two consecutive 32-bit words in the packet\
        \ as shown in Figure 9.7-3. The most significant 32 bits shall be in the first of these two words. The lsb of each\
        \ word shall be on the right. The LSB of the Dwell Fractional Time field shall be 1 femtosecond."
      Field Size (words): '2'
    - CIF/Bit: 4/24
      Field Bit: '31:0'
      Designation: .addressGroupIndex
      Function: CIF 4/24 32-bit unsigned integer, Provides a look-up index that points to a collection of MFP or MFA address
        for data, control, and Ack packets associated with this Schedule Request. That is one or more data packet stream(s)
        with SID matching the Control SID, or  SID's identified by the SID or index in the field (2/30) .citedSID. Plus Control,
        AckR and AckX packet streams with SID matching the Control SID.  The corresponding MFA addresses are in the same field
        (CIF 4, Bit 24) of the corresponding AckR packet. of one or more associated data streams.
      Field Size (words): '1'
    - Field Bit: 32*(3+N)-1 or 32*(3+2N)-1 depending    on structure implementation
      Designation: .dataAddressStructure
      Function: 'Array of records with structure:'
      Field Size (words): '-1'
      Notes: Word 1 is the total size of the array in 32-bit words, equal to 3+2N when SIDs are provided or 3+N when SIDs
        are not provided, where N is the number of data streams. Word 2 contains Header Size (8 bits) = 0, NumWords/Record
        (12 bits) = 1 or 2, and NumRecords (12 bits) = N. Word 3 indicates whether SIDs are provided or obtained using the
        index in .citedSID; bit 31 may be 0 or 1, bit 30 = 1 indicates mandatory MFP address indices are present, and bits
        29:0 = 0. If word 3 bit 31 = 0, the remainder is N words containing 32-bit unsigned integers. If word 3 bit 31 = 1,
        the remainder is 2N words containing 32-bit unsigned integers.
    - CIF/Bit: 4/22
      Field Bit: '63:0'
      Designation: .dataAddressTime
      Function: fractional time format (64-bit 2's complement number).
      Field Size (words): '2'
    - CIF/Bit: 4/21
      Field Bit: '31:16'
      Designation: .reservedBits31to16_4_21
    - CIF/Bit: 4/21
      Field Bit: '15:0'
      Designation: .txDigitalInputPower
      Function: "CIF 4/21 subfield 15:0 shall indicate nominal power level of digital TX signal input to the MFA for transmission,\
        \ in units of dBfs, where \"full scale power\" shall be defined as the power of a complex digital sinusoid with amplitude\
        \ equal to full scale. This parameter shall be expressed in two\u2019s-complement format in the lower 16 bits of the\
        \ field. This subfield has an integer and a fractional part, with the radix point to the right of bit 7 of the subfield.\
        \ It's value ranges from -256 to +255 in 1/128 dBfs."
      Field Size (words): '1'
    - CIF/Bit: '1'
      Field Bit: '31'
      Bits Used: '1'
      Designation: .dataFormat.packBit
      Function: 0 => Processing Efficient Packing, 1 => Link efficient packing
      Field Size (words): '1'
    - Field Bit: '30:29'
      Bits Used: '01'
      Designation: .dataFormat.realOrComplex
      Function: 00 => Real, 01 => Complex Cartesian, 10 => Complex Polar, 11 => Reserved
      Field Size (words): '1'
    - Field Bit: '28:24'
      Bits Used: '00000'
      Designation: .dataFormat.dataItemFormat
      Function: 00000 => Data are signed fixed-point integers using the two's complement format.
      Field Size (words): '1'
    - Field Bit: '23'
      Bits Used: '0'
      Designation: .dataFormat.repeat
      Function: 0 => Sample Component repeating is not in use, 1 => Sample Component repeating is in use.
      Field Size (words): '1'
    - Field Bit: '22:20'
      Bits Used: '000'
      Designation: .dataFormat.eventTagSize
      Function: Shall contain an unsigned number equal to the Event-Tag size used in the paired Data Packet Stream.
      Field Size (words): '1'
    - Field Bit: '19:16'
      Bits Used: '0000'
      Designation: .dataFormat.channelTagSize
      Function: Shall contain an unsigned number equal to the Channel-Tag size used in the paired Data Packet Stream.
      Field Size (words): '1'
    - Field Bit: '15:12'
      Bits Used: '0000'
      Designation: .dataFormat.dataItemFracSize
      Function: "Shall apply specifically to the VRT Signed/Unsigned Fixed-Point Non-Normalized numeric formats. 0000 => for\
        \ all other numeric formats, maintaining compatibility with V49.0. Shall express the number of bits in the fraction\
        \ of a non-normalized number of the format \u201Cinteger.fraction\u201D where the total size of the number is given\
        \ by the \u201CData Item Size\u201D field.  The \u201CData Item Fraction Size\u201D field shall not be greater than\
        \ the Data Item Size \u2013 1."
      Field Size (words): '1'
    - Field Bit: '11:6'
      Bits Used: '001111'
      Designation: .dataFormat.itemPackingFieldSize
      Function: Shall contain an unsigned number that is one less than the actual Item Packing Field size used in the paired
        Data Packet Stream.
      Field Size (words): '1'
    - Field Bit: '5:0'
      Bits Used: '001111'
      Designation: .dataFormat.dataItemSize
      Function: Shall contain an unsigned number that is one less than the actual Data Item size in the paired Data Packet
        Stream.
      Field Size (words): '1'
    - CIF/Bit: '2'
      Field Bit: '31:16'
      Bits Used: '0x0000'
      Designation: .dataFormat.repeatCount
      Function: Not used
      Field Size (words): '1'
    - Field Bit: '15:0'
      Bits Used: '0x0000'
      Designation: .dataFormat.vectorSize
      Function: Not used
      Field Size (words): '1'
- title: Reject Reason Enumeration
  text: 'Reject Reason Enumeration


    The Reject Reason Field  in AckR messages (CIF 4/26) indicates why a schedule request was rejected by the VAS. The first
    two sub-fields indicate the CIF (bits 31:29) and the CIF bit value (bits 28:24) of the parameter whose value resulted
    in rejection. If rejection is not tied to a specific parameter (e.g. Malformed Packet) the first 8 bits take on value
    ''11100000''.


    Bits 23:0 of the Reject Reason Field is an index into the Reject Reason Enumeration. The RREI index value is obtained
    by interpreting bit field as a  24-bit unsigned integer, with bit 23 as the MSB and bit 0 as the LSB. As indicated in
    the table below, higher index values are reserved for use by the MFA integrator to define MFA-specific values.


    Baseline Reject Reason Field Contents Definition'
  headers:
  - Bit Number
  - Error Bit Flag or Sub-Field
  - Notes
  rows:
  - Bit Number: '31:29'
    Error Bit Flag or Sub-Field: 'Schedule Request Payload Field Causing Rejection, CIF #'
    Notes: 'If rejection is not tied to a specific Schedule Request Payload Field, the CIF # (bits 31:29 and CIF Bit # (bits
      28:24) fields shall be set to 0xE0 (''11100000'')'
  - Bit Number: '28:24'
    Error Bit Flag or Sub-Field: 'Schedule Request Payload Field Causing Rejection, Bit # in CIF'
  - Bit Number: '23:0'
    Error Bit Flag or Sub-Field: Reject Reason Enumeration Index (RREI)
  - Bit Number: '0'
    Error Bit Flag or Sub-Field: Not Applicable
    Notes: Request was not rejected
  - Bit Number: '1'
    Error Bit Flag or Sub-Field: Malformed Packet
    Notes: Unable to parse packet, or important elements missing or invalid
  - Bit Number: '2'
    Error Bit Flag or Sub-Field: Bad Stream ID
    Notes: Stream ID exsits but is not a valid value
  - Bit Number: '3'
    Error Bit Flag or Sub-Field: Resource does not exist
  - Bit Number: '4'
    Error Bit Flag or Sub-Field: Resource not working
  - Bit Number: '5'
    Error Bit Flag or Sub-Field: Resource too busy
  - Bit Number: '6'
    Error Bit Flag or Sub-Field: Resource conflict
    Notes: Schedule conflicts with higher priority user detected before scheduling, other than previous
  - Bit Number: '7'
    Error Bit Flag or Sub-Field: Previously scheduled event pre-empted
    Notes: Schedule conflict with higher priority user developed after scheduleing
  - Bit Number: '8'
    Error Bit Flag or Sub-Field: Insufficient lead time, or too late
    Notes: Execution time too close to command time
  - Bit Number: '9'
    Error Bit Flag or Sub-Field: Excessive lead time
    Notes: Exectution time too far from command time
  - Bit Number: '10'
    Error Bit Flag or Sub-Field: Bad Time Stamp
    Notes: Time stamp exists but is in error for reasons other than preceeding
  - Bit Number: '11'
    Error Bit Flag or Sub-Field: Command buffer full
  - Bit Number: '12'
    Error Bit Flag or Sub-Field: Data buffer full
  - Bit Number: '13'
    Error Bit Flag or Sub-Field: Insufficient network capacity
  - Bit Number: '14'
    Error Bit Flag or Sub-Field: Retry requested
    Notes: Condition that prevents scheduling is expected to end soon
  - Bit Number: '15'
    Error Bit Flag or Sub-Field: Parameter missing
    Notes: Required parameter is not present in packet
  - Bit Number: '16'
    Error Bit Flag or Sub-Field: Parameter out of range
    Notes: Parameter is present in packet but is not an allowed value
  - Bit Number: '17'
    Error Bit Flag or Sub-Field: Pointing vector outside FOR
    Notes: Pointing Vector is correctly formatted and within allowed range for antenna, but antenna cannot point in requested
      direction, e.g. blockage
  - Bit Number: '18'
    Error Bit Flag or Sub-Field: EIRP outside allowed range at pointing angle
    Notes: Requested EIRP is inside overall range, but cannot be met at the requested pointing angle
  - Bit Number: '19'
    Error Bit Flag or Sub-Field: Parameter combination not supported
    Notes: Althoug all individual parameters are inside their allowed ranges, this combination of parameter values is not
      supported
  - Bit Number: 20:8388607
    Error Bit Flag or Sub-Field: 'TBD: Working Group'
    Notes: 20:(2^23-1)
  - Bit Number: 8388608:16777215
    Error Bit Flag or Sub-Field: 'TBD: MFA Integrator'
    Notes: (2^23):(2^24-1)
- title: Error Payload Fields
  text: 'Error Payload Fields


    An error condition occurs when the MFA is not able to perform an activity scheduled by the VAS. The Error Payload Field  in
    AckX messages indicates the cause of an Error Condition, usually with reference to a particular Payload Field in the related
    Schedule Request.


    Ref [2] defines a standard 32-bit Error Payload Field  used for every warning or error report. Bits 31:19 in the VITA
    49.2 Error Payload Field are flags indicating particular errors [2]. In [2] bits 17:0 are Reserved or User Defined. In
    this Baseline packet packet standard bits 17:0 have been redefined as shown below.


    Baseline Error Payload Field Contents Definition'
  headers:
  - Bit Number
  - Error Bit Flag or Sub-Field
  - Notes
  rows:
  - Bit Number: '31'
    Error Bit Flag or Sub-Field: Field Not Executed
  - Bit Number: '30'
    Error Bit Flag or Sub-Field: Device Failure
  - Bit Number: '29'
    Error Bit Flag or Sub-Field: Erroneous Field (field not settable on this device)
  - Bit Number: '28'
    Error Bit Flag or Sub-Field: Parameter Out-Of-Range
  - Bit Number: '27'
    Error Bit Flag or Sub-Field: Parameter Precision Not Supported
  - Bit Number: '26'
    Error Bit Flag or Sub-Field: Field Value Invalid (other than previous errors)
  - Bit Number: '25'
    Error Bit Flag or Sub-Field: Timestamp Problem
  - Bit Number: '24'
    Error Bit Flag or Sub-Field: Will Create Hazardous Power Levels
  - Bit Number: '23'
    Error Bit Flag or Sub-Field: Will Cause Distortion
  - Bit Number: '22'
    Error Bit Flag or Sub-Field: In-Band Power Out of Compliance
  - Bit Number: '21'
    Error Bit Flag or Sub-Field: Out-of-Band Power Out of Compliance
  - Bit Number: '20'
    Error Bit Flag or Sub-Field: Will Cause Co-Site Interference
  - Bit Number: '19'
    Error Bit Flag or Sub-Field: Will Cause Regional Interference
  - Bit Number: '18'
    Error Bit Flag or Sub-Field: Reserved
  - Bit Number: '17:15'
    Error Bit Flag or Sub-Field: 'Schedule Request Erroneous Payload Field CIF #'
    Notes: 'If the reported error is not tied to a specific Schedule Request Payload Field, the CIF # (bits 17:15) and CIF
      Bit # (bits 14:10) fields shall be set to 0xE0 (''11100000'')'
  - Bit Number: '14:10'
    Error Bit Flag or Sub-Field: 'Schedule Request Erroneoous Payload Field Bit # in CIF'
  - Bit Number: '9:0'
    Error Bit Flag or Sub-Field: Error Enumeration Index (EEI)
  - Notes: The EEI is a 10-bit unsigned integer with bit 9 as the MSB and bit 0 as the LSB. Each EEI value points to a different
      element of the Error Enumeration. As shown, higher index values are reserved for use by the MFA integrator to indicate
      MFA-specific errors.
  - Bit Number: EEI
    Error Bit Flag or Sub-Field: Reason
  - Bit Number: '0'
    Error Bit Flag or Sub-Field: No Error
  - Bit Number: '1'
    Error Bit Flag or Sub-Field: Resource does not exist
  - Bit Number: '2'
    Error Bit Flag or Sub-Field: Resource not working
  - Bit Number: '3'
    Error Bit Flag or Sub-Field: Resource Conflict
  - Bit Number: '4'
    Error Bit Flag or Sub-Field: Parameter out of range
  - Bit Number: '5'
    Error Bit Flag or Sub-Field: Pointing vector outside FOR
  - Bit Number: '6'
    Error Bit Flag or Sub-Field: Time Out
    Notes: Expected information or data (e.g., Tx Data Packets) not received in time to execute
  - Bit Number: '7'
    Error Bit Flag or Sub-Field: EIRP outside allowed range at pointing angle
    Notes: Requested EIRP is inside overall range, but cannot be met at the requested pointing angle
  - Bit Number: 8:511
    Error Bit Flag or Sub-Field: To be defined by Working Group
  - Bit Number: 512:1022
    Error Bit Flag or Sub-Field: 'MFA Specific: To be defined by MFA integrator'
