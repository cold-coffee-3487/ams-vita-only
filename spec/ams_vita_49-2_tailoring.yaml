    - Word: '10'
      Bit: '31'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .cfci
      Function: An Error has occurred with no correspoinding Payload Field
      Notes: 1 => an Error Payload Field is included below describing an error  that does not correspond to any of the Command
        Payload Fields supported
    - Bit: '29'
      Bit Used: B
      Default Value: '0'
