    - Word: '11'
      Bit: 95:64
      Bit Used: N
      Default Value: '0'
      Designation: .controlleeIdWord2
    - Word: '12'
      Bit: '31:0'
      Bit Used: N
      Default Value: '1'
      Designation: .controlleeIdWord3
    - Word: '13'
      Bit: '31:0'
      Bit Used: N
      Default Value: '0'
      Designation: .controlleeIdWord4
  - group_name: .controllerId (Controller Identifier, format is either 32-bit or 128-bit and is indicated by .cam.ir)
    requirement: Forbidden
    fields:
    - Word: '14'
      Bit: '31:0'
      Bit Used: N
      Default Value: '0'
      Designation: .controllerIdWord0
    - Word: '14'
      Bit: 127:96
      Bit Used: N
      Designation: .controllerIdWord1
    - Word: '15'
      Bit: 95:64
      Bit Used: N
      Default Value: '0'
      Designation: .controllerIdWord2
    - Word: '16'
      Bit: '31:0'
      Bit Used: N
      Default Value: '0'
      Designation: .controllerIdWord3
    - Word: '17'
      Bit: '31:0'
      Bit Used: N
      Default Value: '0'
      Designation: .controllerIdWord4
  - group_name: .cif0 (Control Indicator Field 0, Legacy Fields)
    requirement: Mandatory
    notes: CIF 0 structure, default and range may be the same as in the associated  Extension Control packet, or it may only
      contain fields needed by the AckR. Fields flagged in this page as present are information being sent from the MFA to
      the MFP, not error or warning flags as in AckV and AckX, and not sending back values previously set by the MFP in a
      Control Packet as in AckS.
    fields:
    - Word: '10'
      Bit: '31'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .cfci
      Function: 'Context field change indicator: Control packets are only sent when something needs to be changed so this
        should be set to 1'
      Field Size (words): '0'
    - Bit: '30'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .rpi
      Function: Reference point identifier
    - Bit: '29'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .bandwidth
      Function: 3 dB Bandwidth
      Field Size (words): '2'
    - Bit: '28'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .ifRefFreq
      Function: IF reference frequency.  This is the digital frequency offset within the superchannel of the transmission
        burst.  It is referenced to the center of the superchannel.  Hence the ifRefFreq can be positive or negative.
      Field Size (words): '2'
    - Bit: '27'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .rfRefFreq
      Function: RF reference frequency.  This is the center of the superchannel and will always be a large positive number.
      Field Size (words): '2'
    - Bit: '26'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .rfRefFreqOffset
      Function: Offset from RF Ref Freq of RF frequency that translates to/from IF Ref Freq
      Field Size (words): '2'
    - Bit: '25'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .ifBandOffset
      Function: IF band offset
      Field Size (words): '2'
    - Bit: '24'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .refLevel
      Function: Reference level relates digital signal amplitude to analog signal power. An analog Reference Point and location
        for the digital Described Signal must be defined in system documentation. The Reference Level is the AC power of a
        single analog sine wave at the reference point that produces a unit-scale digital sine wave as the Described Signal.
        Note that a unit scale sine wave for N-bit two's complement data is defined as one with amplitude ranging from -2^(N-1)
        to +2^(N-1), which exceeds the available range of an N-bit two's complement number at its peak value.
      Field Size (words): '1'
    - Bit: '23'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .gain
      Function: Gain bits 31:16 are not used in the base set and shall be set to 0. Bits 15:0 should be used in Base Set Rx
        Schedule Requests to control signal amplitude into the MFA ADC. Gain shall not be used on Tx, as it will conflict
        with EIRP (figure of merit, CIF 4/29). Gain bits 15:0 shall be set to 0 in Tx Schdule Requests.
      Field Size (words): '1'
    - Bit: '22'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .overRangeCount
      Function: Over-range count
    - Bit: '21'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .sampleRate
      Function: Sample rate in Hz
      Field Size (words): '2'
    - Bit: '20'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .tsa
      Function: Time stamp adjustment
    - Bit: '19'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .tsCalTime
      Function: Time stamp calibration time
    - Bit: '18'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .temp
      Function: Temperature
    - Bit: '17'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .deviceId
      Function: Device identifier
    - Bit: '16'
      Bit Used: N
      Default Value: '0'
      Range: '0'
