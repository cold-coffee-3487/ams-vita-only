- title: ScheduleAck(AckR)Packet
  text: Extension AckR Packet Template (Acknowledgement packet with Response Data - only exists as an extension)
  groups:
  - group_name: .header
    requirement: Mandatory
    notes: Header Bits mirror values in associated Extension Control Packet
    fields:
    - Word: '1'
      Bit: '31:28'
      Bit Used: B
      Default Value: '0111'
      Range: '0111'
      Designation: .type
      Function: 'Packet Type: 0111 => Extension Command Packet'
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '27'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .cBit
      Function: Indicates whether CLASS ID is included in the prologue
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '26'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .isAck
      Function: Indicates THAT THIS IS an acknowledge packet
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '25'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit25
      Function: Reserved
      Time Determined: N/A
      Time When Payload Value Determined: N/A
    - Bit: '24'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .isCancellation
      Function: Indicates whether this is cancellation packet
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '23:22'
      Bit Used: B
      Default Value: '11'
      Range: '11'
      Designation: .tsi
      Function: 'Indicates: 00 No int seconds time stamp, 01 => UTC, 10 => GPS, 11 => Other'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '21:20'
      Bit Used: B
      Default Value: '10'
      Range: '10'
      Designation: .tsf
      Function: 'Indicates: 00 => No frac seconds field, 01 => sample count, 10 => picoseconds, 11 => free running count'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '19:16'
      Bit Used: B
      Default Value: '0'
      Range: 0:15
      Designation: .packetCount
      Function: 4-Bit Packet sequence number for this packet type in this streamID
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '15:0'
      Bit Used: B
      Default Value: '15'
      Range: '15'
      Designation: .packetSize
      Function: Total number of 32-bit words in the packet including the prologue
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
  - group_name: .streamId (Stream Identifier)
    requirement: Mandatory
    fields:
    - Word: '2'
      Bit: '31:0'
      Bit Used: B
      Default Value: '1'
      Designation: .sid
      Function: See Control and Context SID definitions.  Data SIDs will match the applicable control SIDs
  - group_name: .classId (Class Identifier)
    requirement: Mandatory
    fields:
    - Word: '3'
      Bit: '31:27'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .padBitCount
      Function: "Number of pad bits (0\u202631) at the end of the packet to hit a 32-bit word boundary. Not used by Base Set"
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '26:24'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits26to24
      Function: Reserved
      Time Determined: N/A
      Time When Payload Value Determined: N/A
    - Bit: '23:0'
      Bit Used: B
      Default Value: '0xAAAAAA'
      Range: '0xAAAAAA'
      Designation: .oui
      Function: Organizationally Unique Identifier (OUI)
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Word: '4'
      Bit: '31:24'
      Bit Used: B
      Default Value: '0x04'
      Range: '4:5'
      Designation: .infoClassCode_Type
      Function: 0 => Unknown; 1 => TxComm, 2 => RxComm, 3 => Sensor;  4 => TxComm base set; 5 => RxComm Base Set; 6 => TxComm
        extended set 1; 7 => RxComm extended set 1; 8 => TxComm  extended set 2; 9 => RxComm extended set 2; (10-255) => TBD
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '23:16'
      Bit Used: B
      Default Value: '0x00'
      Range: 0:2^8-1
      Designation: .infoClassCode_Version
      Function: Version number of information class
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '15:8'
      Bit Used: B
      Default Value: '0x0B'
      Range: '0x0B'
      Designation: .packetClassCode_Type
      Function: 'Defined PacketTypes:  0x00 => undefined, 0x0A => Base Set Control ScheduleRequest, 0x0B => Base Set Schedule
        Acknowledge (AckR),  0x0C => Base Set Execution Acknowledge (AckX), 0x0D => Base Set Data, 0x0E => Base Set DataContext'
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
    - Bit: '7:0'
      Bit Used: B
      Default Value: '0x05'
      Range: 0:2^8-1
      Designation: .packetClassCode_Version
      Function: Version of Packet Class definition for specified type
      Time Determined: Fixed per VA Definition
      Time When Payload Value Determined: N/A
  - group_name: .timeStamp (Time Stamp)
    requirement: Mandatory
    notes: When a self-scheduling MFA is responding to a Control Packet that requested a flexible schedule time (.flexShedReq=1
      in CAM bit 7), and the MFA was able to schedule the requested access, the time stamp shall indicate the scheduled time
      for execution of the control.
    fields:
    - Word: '5'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^32-1
      Designation: .tsi
      Function: Integer time stamp, UTC seconds since midnight Jan 1, 2019
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
    - Word: '6'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Range: 0:2^64-1
      Designation: .tsf
      Function: Fractional time stamp most-significant (Upper 32 bits); format indicated by Header.tsf, 10 = picoseceonds
        (UCI) since last second
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
    - Word: '7'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
      Function: Fractional time stamp least-significant (Lower 32 bits); format indicated by Header.tsf, 10 = picoseceonds
        (UCI) since last second
      Designation: .tsfLower
      Time Determined: Dynamic within per VA limits
      Time When Payload Value Determined: N/A
  - group_name: .cam (Control/Ack Mode Field)
    requirement: Mandatory
    fields:
    - Word: '8'
      Bit: '31'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ce
      Function: Identifier fields are not used in the AMS Base Set; set to zero
    - Bit: '30'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ie
      Function: Identifier fields are not used in the AMS Base Set; set to zero
    - Bit: '29'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .cr
      Function: Identifier fields are not used in the AMS Base Set; set to zero
    - Bit: '28'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ir
      Function: Identifier fields are not used in the AMS Base Set; set to zero
    - Bit: '27'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .p
      Function: Matches values in Control Packet being Acknowledged
    - Bit: '26'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .w
      Function: Matches values in Control Packet being Acknowledged
    - Bit: '25'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .er
      Function: Matches values in Control Packet being Acknowledged
    - Bit: '24:23'
      Bit Used: B
      Default Value: '10'
      Range: '10'
      Designation: .actionBits
      Function: Matches values in Control Packet being Acknowledged
    - Bit: '22'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .nack
      Function: Matches values in Control Packet being Acknowledged  - setting bit 22 (Nack) to 1 does not change this Ack
        Message to a Nack message
    - Bit: '21'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBit21
      Function: Reserved
    - Bit: '20'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .ackV
      Function: 1 = > Indicates this is a Validation Ack packet, 0 => otherwise. AckV, AckX, AckR, and AckS are mutually exclusive.
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '19'
      Bit Used: B
      Default Value: '0'
      Range: '0'
      Designation: .ackX
      Function: 1 = > Indicates this is an Execution Ack packet, 0 => otherwise. AckV, AckX, AckR, and AckS are mutually exclusive.
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '18'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ackS
      Function: 1 => Indicates this is a Query-State Ack packet, 0 => otherwise. AckV, AckX, AckR, and AckS are mutually exclusive.
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '17'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .ackW
      Function: Warning reports are not supported in AckR by the AMS Base Set; set to zero
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '16'
      Bit Used: B
      Default Value: '0'
      Range: 0:1
      Designation: .ackEr
      Function: 1 => Indicates errors were generated. May be used in AckX or AckR, not applicable in AckV Packets. AckEr=1
        in an AckR packet makes it a NackR packet.
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '15'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .ackR
      Function: 1 => Indicates this is an Information-Response Ack (AckR) packet, 0 => otherwise. AckV, AckX, AckR, and AckS
        are mutually exclusive.
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '14:12'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .timingControl
      Function: 'Timing Control: refer to documentation for details, 000 => indicates "it is at the discretion of the controllee
        when the control fields are executed"'
      Time Determined: Fixed
      Time When Payload Value Determined: N/A
    - Bit: '11'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .ackP
      Function: Indicates partial response tp selected CIFs
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '10'
      Bit Used: B
      Default Value: '1'
      Range: 0:1
      Designation: .schX
      Function: 0 => one or more fields can NOT be scheduled for execution at time in timestamp, 1 => all fields can be scheduled
        for execution at time in timestamp.  A self-scheduling MFA may send an AckR packet with .schX = 0 if the access requested
        by a Control Packet could not be scheduled. If a request was scheduled and an AckR packet was sent with .schX = 1,
        after which the packet was bumped from the schedule by a higher priority request, a second AckR or an AckV packet
        with .schX = 0 may be sent. An AckX packet with .schX = 0 shall be sent if the control packet was not executed due
        to schedule conflicts, e.g., the allowed (range of) execution time(s) has passed.
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '9:8'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits9to8
    - Bit: '7:4'
      Bit Used: B
      Default Value: '1'
      Range: '1'
      Designation: .schReqType
      Function: Matches values in Control Packet being Acknowledged
    - Bit: '3'
      Bit Used: E
      Default Value: '0'
      Range: '0'
      Designation: .reqStatusChange
      Function: 'The status of the Control Packet Schedule Request being acknowledged has changed. For example if a schedule
        request was previously denied for some reason, e.g. a local pre-emption in the MFA, that reason has gone away. Some
        configurations for this example are: .reqStatusChange=1, .schX=1 => request status has changed and the request has
        now been scheduled at the .timeStamp of this message; .reqStatusChange=1, .schX=0, .rejectReason=7 (try request again)
        => request status has changed but the VAS was unable to schedule the request (possibly because the requested schedule
        time window is over), send a new request. Other uses of .reqStatusChange can be described in the packet class type
        description.'
      Time Determined: Dynamic
      Time When Payload Value Determined: N/A
    - Bit: '2:0'
      Bit Used: N
      Default Value: '0'
      Range: '0'
      Designation: .reservedBits2to0
      Function: Reserved
  - group_name: .messageId (Unique Message Identifier)
    requirement: Mandatory
    fields:
    - Word: '9'
      Bit: '31:0'
      Bit Used: B
      Default Value: '0'
